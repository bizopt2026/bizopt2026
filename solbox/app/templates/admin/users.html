{% extends "base.html" %}
{% block title %}사용자 관리{% endblock %}
{% block content %}
<div class="page-head"><h1>사용자 관리</h1></div>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

<section class="card">
  <h2>사용자 추가</h2>
  <form method="post" action="/admin/users" class="row">
    <label>아이디 <input name="username" required></label>
    <label>이름 <input name="name"></label>
    <label>비밀번호 <input type="password" name="password" autocomplete="new-password" required></label>
    <label>권한
      <select name="role">
        {% for code, text in roles.items() %}<option value="{{ code }}">{{ text }}</option>{% endfor %}
      </select>
    </label>
    <button type="submit" class="primary">추가</button>
  </form>
</section>

<div class="table-wrap"><table>
  <thead><tr><th>아이디</th><th>이름</th><th>권한</th><th>사용</th><th>새 비밀번호</th><th></th></tr></thead>
  <tbody>
  {% for u in users %}
    {% set f = "u" ~ u.id %}
    <tr>
      <td><form id="{{ f }}" method="post" action="/admin/users/{{ u.id }}"></form>{{ u.username }}</td>
      <td><input form="{{ f }}" name="name" value="{{ u.name }}"></td>
      <td>
        <select form="{{ f }}" name="role">
          {% for code, text in roles.items() %}<option value="{{ code }}" {% if u.role == code %}selected{% endif %}>{{ text }}</option>{% endfor %}
        </select>
      </td>
      <td><input form="{{ f }}" type="checkbox" name="is_active" value="on" {% if u.is_active %}checked{% endif %}></td>
      <td><input form="{{ f }}" type="password" name="password" autocomplete="new-password" placeholder="변경할 때만 입력"></td>
      <td><button form="{{ f }}" type="submit" class="small">저장</button></td>
    </tr>
  {% endfor %}
  </tbody>
</table></div>
{% endblock %}
