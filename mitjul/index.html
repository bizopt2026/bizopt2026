<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>밑줄 — 긋고, 되묻고, 건네다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 밤의 서재: 깊은 남색 + 형광펜 노랑 */
  --paper:#F3F4F8; --card:#FFFFFF; --ink:#1E2235; --muted:#6A6F85; --line:#E1E3EC;
  --accent:#2F3A6B; --accent-soft:#E4E7F3; --hl:#F7DC6F; --hl-soft:#FBF1C4; --hl-ink:#5E4B12; --green:#4A5170;
  --f-display:var(--f-body); --f-body:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --serif:var(--f-body); --sans:var(--f-body);
  --fs-xl:var(--t1); --fs-l:var(--t2); --fs-m:var(--t3); --fs-s:var(--t4); --fs-xs:var(--t4);
  --r:16px; --shadow:0 1px 2px rgba(20,24,50,.05),0 6px 18px rgba(20,24,50,.07);
  --inkbg:#1E2235; --onink:#FFFFFF; --ink2:#3E4460; --soft:#ECEEF5; --soft2:#E1E4EE; --tag-g:#E6E9F3; --green-ink:#2F3A6B;
  --tabbg:rgba(243,244,248,.94); --banner:#EEF0F8; --banner-line:#D3D8EA; --seal:#2F3A6B; --on-accent:#FFFFFF;
}
body[data-theme="dark"]{
  --paper:#10131F; --card:#181C2B; --ink:#E6E8F2; --muted:#9AA0B8; --line:#2A2F44;
  --accent:#9AA8E8; --accent-soft:#232A4A; --hl:#6B5A1E; --hl-soft:#3A3218; --hl-ink:#F2DC8A; --green:#AEB5D0;
  --inkbg:#E6E8F2; --onink:#10131F; --ink2:#C5CAE0; --soft:#1F2436; --soft2:#272D42; --tag-g:#232840; --green-ink:#C9D0F0;
  --tabbg:rgba(16,19,31,.94); --banner:#1C2135; --banner-line:#33395A; --shadow:0 1px 2px rgba(0,0,0,.35); --seal:#F7DC6F; --on-accent:#10131F;
}
html{background:var(--paper)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-m);line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.brand{font-family:var(--serif);font-weight:700;font-size:var(--t1);letter-spacing:-.02em;cursor:pointer}
.brand span{background:linear-gradient(transparent 62%,var(--hl) 62%)}
.sync{font-size:var(--t4);color:var(--muted);text-align:right;max-width:120px;line-height:1.3}
main{padding:6px 20px 20px}
h1{font-family:var(--serif);font-size:var(--t1);line-height:1.45;margin:10px 0 6px;letter-spacing:-.02em;font-weight:700}
h2{font-size:var(--t3);margin:0;font-weight:700}
.hero p{margin:0;color:var(--muted);font-size:var(--t4)}
.stats{display:flex;gap:8px;margin:14px 0 22px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--serif);font-size:var(--t1)}
.stat span{font-size:var(--t4);color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;gap:10px}
.btn{background:var(--inkbg);color:var(--onink);border-radius:999px;padding:9px 16px;font-weight:500;font-size:var(--t3)}
.btn.small{padding:7px 13px;font-size:var(--t4)}
.btn.accent{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:var(--t4);white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--inkbg);color:var(--onink);border-color:var(--inkbg)}
.tag{display:inline-block;font-size:var(--t4);padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.tag.g{background:var(--tag-g);color:var(--green)}
.tag.m{background:var(--soft2);color:var(--muted)}
.books{display:grid;gap:10px}
.book{display:flex;gap:14px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.spine{width:46px;min-height:64px;border-radius:4px 8px 8px 4px;flex:none;position:relative;box-shadow:inset 4px 0 0 rgba(0,0,0,.12)}
.spine::after{content:"";position:absolute;left:10px;right:10px;top:12px;height:2px;background:rgba(255,255,255,.55)}
.book .t{font-family:var(--serif);font-weight:700;font-size:var(--t2);line-height:1.35}
.book .a{color:var(--muted);font-size:var(--t4);margin:2px 0 6px}
.book .info{flex:1;min-width:0}
.book .cnt{font-size:var(--t4);color:var(--muted);margin-left:6px}
.empty{text-align:center;color:var(--muted);padding:36px 16px;border:1px dashed var(--line);border-radius:var(--r);font-size:var(--t3)}
.empty b{display:block;font-family:var(--serif);color:var(--ink);font-size:var(--t2);margin-bottom:4px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:var(--t3);padding:4px 0;margin-bottom:6px}
.bookhead{display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.bookhead .spine{width:58px;min-height:84px}
.bookhead .t{font-family:var(--serif);font-size:var(--t2);font-weight:700;line-height:1.35}
.bookhead .memo{margin:8px 0 0;font-size:var(--t3);color:var(--ink2)}
.stars{color:var(--accent);letter-spacing:1px;font-size:var(--t4)}
.links{display:flex;gap:14px;margin-top:10px;font-size:var(--t4);color:var(--muted)}
.links button{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.quotes{display:grid;gap:12px}
.quote{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 12px;box-shadow:var(--shadow)}
.quote blockquote{margin:0;font-family:var(--serif);font-size:var(--t2);line-height:1.8;white-space:pre-wrap;word-break:keep-all}
.quote blockquote mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit}
.quote .meta{font-size:var(--t4);color:var(--muted);margin-top:8px}
.quote .feel{margin:10px 0 0;padding:10px 12px;background:var(--soft);border-radius:10px;font-size:var(--t4);color:var(--ink2);white-space:pre-wrap}
.quote .feel::before{content:"내 마음 · ";color:var(--accent);font-weight:500}
.qactions{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.talkbtn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:999px;padding:7px 14px;font-size:var(--t4);font-weight:500}
.talkbtn.resume{background:var(--green);color:var(--onink)}
.qactions .sp{flex:1}
.qactions .n{font-size:var(--t4);color:var(--muted)}
.more{width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:var(--t2);line-height:1}
.talks{display:grid;gap:12px}
.talk{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.talk .tt{font-family:var(--serif);font-weight:700;font-size:var(--t2)}
.talk .q{font-size:var(--t4);color:var(--muted);margin:4px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.talk .em{display:flex;gap:5px;flex-wrap:wrap}
.talk .d{font-size:var(--t4);color:var(--muted);margin-top:8px}
.detail .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.detail h1{margin-top:4px}
.detail .lbl{font-size:var(--t4);color:var(--accent);font-weight:700;margin-bottom:4px;letter-spacing:.02em}
.detail .big{font-family:var(--serif);font-size:var(--t2);line-height:1.8;white-space:pre-wrap}
.authorline{font-family:var(--serif);font-size:var(--t2);line-height:1.75;border-left:3px solid var(--green);padding-left:12px;color:var(--green-ink)}
details summary{cursor:pointer;font-size:var(--t3);font-weight:500;padding:4px 0}
.transcript{margin-top:10px;display:grid;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 20px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tabbg);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs .in{display:flex;max-width:640px;width:100%}
.tabs button{flex:1;padding:10px 0 12px;font-size:var(--t4);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--ink);font-weight:700}
/* chat */
.chat{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:10}
.chat-in{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-head .who{font-weight:700;font-size:var(--t3)}
.chat-head .sub{font-size:var(--t4);color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--inkbg);color:var(--onink);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;flex:none}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--t1);flex:none}
.chat-quote{margin:12px 14px 0;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-family:var(--serif);font-size:var(--t3);line-height:1.7;max-height:96px;overflow:auto;white-space:pre-wrap}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.note{font-size:var(--t4);color:var(--muted);text-align:center;margin:0 0 4px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word;font-size:var(--t3);line-height:1.7}
.msg.a{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;font-family:var(--serif)}
.msg.u{background:var(--inkbg);color:var(--onink);align-self:flex-end;border-bottom-right-radius:4px}
.typing{color:var(--muted)}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
.center{align-self:center}
.composer{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--paper)}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:var(--t4);color:var(--muted)}
.inputrow{display:flex;gap:8px;align-items:flex-end}
.inputrow textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:9px 14px;max-height:120px;min-height:40px;outline:none;line-height:1.5}
.inputrow textarea:focus{border-color:var(--ink)}
.send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.send:disabled{opacity:.35}
/* sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,22,15,.38)}
.sheet.hidden{display:none}
.panel{background:var(--paper);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.panel h3{font-family:var(--serif);font-size:var(--t2);margin:0 0 14px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:var(--t4);font-weight:500;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;outline:none}
.field textarea{resize:vertical;min-height:80px;line-height:1.6}
.field textarea.serif{font-family:var(--serif);font-size:var(--t3)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ink)}
.hint{font-size:var(--t4);color:var(--muted);margin-top:4px}
.rate{display:flex;gap:4px}
.rate button{font-size:24px;color:var(--line);padding:0 2px}
.rate button.on{color:var(--accent)}
.panel .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.menu button{display:block;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line);font-size:var(--t3)}
.menu button.danger{color:#b3261e}
.loading{text-align:center;padding:28px 0;color:var(--muted)}
/* photo + marker */
.cta{display:flex;gap:8px;margin:0 0 14px}
.cta .photo{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--inkbg);color:var(--onink);border-radius:14px;padding:13px;font-weight:500}
.cta .manual{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;font-size:var(--t3)}
.thumb{display:block;width:100%;height:120px;object-fit:cover;object-position:top;border-radius:10px;margin-bottom:12px;border:1px solid var(--line);cursor:zoom-in;background:var(--soft2)}
.marker{position:fixed;inset:0;z-index:20;background:#1d1a17;color:#fff;display:flex;flex-direction:column}
.marker.hidden{display:none}
.mk-head{display:flex;align-items:center;gap:8px;padding:10px 12px;max-width:900px;width:100%;margin:0 auto}
.mk-head .ttl{flex:1;font-weight:700}
.mk-stage{flex:1;overflow:auto;min-height:0;padding:8px;position:relative}
.mk-stage canvas{display:block;margin:0 auto;touch-action:none;border-radius:4px;box-shadow:0 4px 20px rgba(0,0,0,.4);background:#fff}
.mk-stage.pan canvas{touch-action:auto;cursor:grab}
.mk-tools{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding:8px 10px}
.mk-tools button{background:#34302b;color:#eee;border-radius:999px;padding:7px 10px;font-size:var(--t4)}
.mk-tools button.on{background:#f7e3a1;color:#1d1a17;font-weight:700}
.mk-tools .sep{width:1px;background:#4a443d;margin:0 2px}
.mk-foot{padding:8px 14px calc(12px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:0 auto}
.mk-foot p{margin:0 0 8px;font-size:var(--t4);color:#b9ae9f;text-align:center}
.mk-foot .btn{width:100%;padding:13px;font-size:var(--t3);background:var(--accent)}
.mk-busy{position:absolute;inset:0;background:rgba(20,17,14,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:var(--t3);text-align:center;padding:20px}
.mk-busy.hidden{display:none}
.ctx{font-size:var(--t4);color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:6px;white-space:pre-wrap;max-height:110px;overflow:auto}
.imgview{width:100%;border-radius:10px;display:block}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin:4px 0 12px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;padding:11px 0;outline:none;min-width:0;color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within{border-color:var(--ink)}
.link{color:var(--accent);font-size:var(--t4);padding:0;text-align:left}
button.stat{text-align:left;cursor:pointer}
.qlist{display:grid;gap:8px}
.qrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.qrow img{width:44px;height:56px;object-fit:cover;object-position:top;border-radius:6px;flex:none;background:var(--soft2)}
.qrow .qmark{width:44px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:34px;color:var(--accent);background:var(--soft);border-radius:6px}
.qrow .qbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.qrow .qt{font-family:var(--serif);font-size:var(--t3);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qrow .qm{font-size:var(--t4);color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:8px;margin:2px 0 10px;font-size:var(--t4);color:var(--muted)}
.toolbar span{flex:1}
.sortsel{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px;font-size:var(--t4)}
.vt{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;font-size:var(--t4)}
.seg{display:flex;background:var(--soft2);border-radius:12px;padding:3px;margin:16px 0 14px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:var(--t3);color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.group{margin-bottom:18px}
.ghead{display:flex;align-items:center;gap:8px;width:100%;font-family:var(--serif);font-weight:700;font-size:var(--t3);padding:6px 0 8px;text-align:left}
.ghead small{color:var(--muted);font-family:var(--sans);font-weight:400}
.gspine{width:8px;height:20px;border-radius:2px}
.month{font-size:var(--t4);font-weight:700;color:var(--muted);margin:8px 0 -2px;letter-spacing:.04em}
.qactions .n{font-size:var(--t4);color:var(--muted)}
.recbanner{display:flex;gap:12px;background:var(--banner);border:1px solid var(--banner-line);border-radius:var(--r);padding:14px;margin:14px 0 4px}
.rb-t{font-weight:700;font-size:var(--t3)}
.rb-s{font-size:var(--t4);color:var(--ink2);margin:2px 0 10px}
.rb-a{display:flex;gap:6px}
.recLink{display:block;width:100%;margin:18px 0 4px;padding:13px;border:1px dashed var(--banner-line);border-radius:var(--r);color:var(--accent);font-size:var(--t3);font-weight:500;background:transparent}
.recitem{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;margin-bottom:8px;cursor:pointer}
.recitem input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.recitem b{font-family:var(--serif)}
.recitem small{color:var(--muted)}
.recitem em{display:block;font-style:normal;font-size:var(--t4);color:var(--ink2);margin-top:4px}
.recitem.dis{opacity:.55}
article.book{cursor:pointer}
.book .info{display:flex;flex-direction:column}
.bacts{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.bacts button:not(.more){font-size:var(--t4);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--paper)}
.bacts .qbtn{background:var(--inkbg)!important;color:var(--onink);border-color:var(--inkbg)!important}
.bacts .more{width:28px;height:28px}
.prog{display:flex;align-items:center;gap:8px;font-size:var(--t4);color:var(--muted);margin-top:4px}
.prog .bar{flex:1;height:6px;background:var(--soft2);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.empty-prog{font-style:italic}
.shelfseg button{display:flex;flex-direction:column;align-items:center;gap:0;font-size:var(--t4);padding:7px 2px}
.shelfseg b{font-size:var(--t3);font-family:var(--serif)}
.stseg{display:flex;gap:6px;margin:12px 0 8px;overflow-x:auto}
.stseg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 4px;font-size:var(--t4);white-space:nowrap;color:var(--muted)}
.stseg button.on{background:var(--inkbg);color:var(--onink);border-color:var(--inkbg);font-weight:700}
.progbox{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.progbox .prog{flex:1;margin:0}
.progbox .pe{font-size:var(--t4);color:var(--accent)}
.progbox .muted{flex:1;font-size:var(--t4);color:var(--muted)}
.dates{font-size:var(--t4);color:var(--muted);margin-top:4px}
.stpick{display:flex;gap:6px;flex-wrap:wrap}
.stpick label{cursor:pointer}
.stpick input{display:none}
.stpick span{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:var(--t4)}
.stpick input:checked+span{background:var(--inkbg);color:var(--onink);border-color:var(--inkbg)}
.pick{display:grid;gap:6px}
.pick button{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:12px;width:100%}
.pick button.on{border-color:var(--accent)}
.pick b{display:block;font-family:var(--serif);font-size:var(--t3)}
.pick small{color:var(--muted);font-size:var(--t4)}
.pick .newbook{justify-content:center;color:var(--accent);font-weight:500;border-style:dashed}
.pick .nobook{justify-content:center;color:var(--muted);font-size:var(--t4);background:transparent;border:0}
.mkbook{display:block;color:#f7e3a1;font-size:var(--t4);font-weight:500;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--inkbg);color:var(--onink);padding:9px 16px;border-radius:999px;font-size:var(--t4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--soft2),var(--soft),var(--soft2));background-size:200% 100%;animation:sk 1.4s infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
/* v5 */
.topr{display:flex;align-items:center;gap:6px}
.gear{width:34px;height:34px;border-radius:50%;color:var(--muted);display:flex;align-items:center;justify-content:center}
.today{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;margin:8px 0 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.today .lbl{font-size:var(--t4);font-weight:700;color:var(--accent);letter-spacing:.06em;margin-bottom:8px}
.today blockquote{margin:0;font-family:var(--serif);font-size:var(--t2);line-height:1.75;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.today blockquote mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit}
.today .src{font-size:var(--t4);color:var(--muted);margin-top:10px}
.today::after{content:"“";position:absolute;right:12px;top:-14px;font-family:var(--serif);font-size:110px;color:var(--soft2);z-index:0;pointer-events:none}
.today>*{position:relative;z-index:1}
.mini{display:flex;align-items:center;gap:6px;margin:0 0 16px;font-size:var(--t4);color:var(--muted)}
.mini button{padding:4px 2px;color:var(--muted)}
.mini b{color:var(--ink);font-family:var(--serif);font-size:var(--t3);margin-right:2px}
.mini .dot{opacity:.5}
.fabs{position:fixed;right:max(16px,calc(50vw - 304px));bottom:calc(76px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;z-index:6}
.fab{width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(16,165,142,.38)}
.fab2{width:42px;height:42px;border-radius:50%;background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:var(--t2)}
.quick{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-start;max-width:100%}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:var(--t4);color:var(--ink2)}
.offer{align-self:stretch;background:var(--banner);border:1px solid var(--banner-line);border-radius:14px;padding:12px 14px;font-size:var(--t3)}
.offer div{display:flex;gap:6px;margin-top:8px}
.emap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;margin-bottom:14px}
.emap .lbl{font-size:var(--t4);font-weight:700;color:var(--accent);margin-bottom:8px}
.erow{display:flex;align-items:center;gap:8px;width:100%;padding:4px 0;font-size:var(--t4);text-align:left}
.erow span:first-child{width:76px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .ebar{flex:1;height:10px;background:var(--soft2);border-radius:99px;overflow:hidden}
.erow .ebar i{display:block;height:100%;background:var(--accent);opacity:.75;border-radius:99px}
.erow.on{font-weight:700}.erow.on .ebar i{opacity:1}
.erow span:last-child{width:22px;text-align:right;color:var(--muted);font-size:var(--t4)}
.emonths{display:flex;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.emonths div{flex:1;min-width:0;text-align:center}
.emonths small{display:block;font-size:var(--t4);color:var(--muted)}
.emonths b{display:block;font-size:var(--t4);font-weight:500;word-break:keep-all;line-height:1.35}
.optrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.optrow button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:var(--t4)}
.optrow button.on{background:var(--inkbg);color:var(--onink);border-color:var(--inkbg)}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px}
#toast button{flex:none;white-space:nowrap;background:var(--accent);color:#fff;border-radius:999px;padding:5px 12px;font-size:var(--t4);font-weight:700}
.sharecard{width:100%;border-radius:12px;display:block;border:1px solid var(--line)}
.mk-alt{display:block;width:100%;margin-top:8px;color:#e8dccb;font-size:var(--t4);padding:6px;text-decoration:underline;text-underline-offset:3px}
.sentlist{display:grid;gap:6px;max-height:55vh;overflow:auto;margin-bottom:12px}
.sentlist button{text-align:left;font-family:var(--serif);font-size:var(--t3);line-height:1.65;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.sentlist button.on{background:linear-gradient(transparent 0,var(--hl) 0);border-color:var(--accent)}
/* game */
.mini .off{filter:grayscale(1);opacity:.5}
.heart{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:var(--t4);color:var(--accent);min-width:38px}
.heart.on{background:var(--accent-soft);border-color:var(--accent)}
.lvcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.lvtop{display:flex;gap:12px;align-items:center}
.lvbadge{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#d9934f);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--t3);flex:none;box-shadow:0 4px 12px rgba(180,80,40,.3)}
.lvt{font-family:var(--serif);font-weight:700;font-size:var(--t2)}
.lvbar{height:8px;background:var(--soft2);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.lvbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#e2a35c);border-radius:99px}
.lvs{font-size:var(--t4);color:var(--muted)}
.streak{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.streak b{font-family:var(--serif);font-size:var(--t1);margin:0 3px}
.streak small{display:block;font-size:var(--t4);color:var(--muted)}
.streak .fire{font-size:var(--t1)}.streak .fire.off{filter:grayscale(1);opacity:.4}
.wdots{display:flex;gap:6px}
.wdots span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--t4);color:var(--muted)}
.wdots i{width:20px;height:20px;border-radius:50%;background:var(--soft2);display:block}
.wdots span.on i{background:var(--accent)}
.wdots span.tdy{color:var(--ink);font-weight:700}
.wdots span.tdy i{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--accent)}
.lvhint{font-size:var(--t4);color:var(--ink2);background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:10px}
.ceremony{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(135deg,#fdf1d6,#f8e1c6);border:1px solid #ecc98f;border-radius:16px;padding:12px 14px;margin:10px 0 12px;color:#4a3412}
.ceremony>span:first-child{font-size:28px}
.ceremony b{display:block;font-size:var(--t3)}
.ceremony small{font-size:var(--t4);opacity:.8}
.ceremony>span:last-child{margin-left:auto;font-size:var(--t1)}
.podium{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:8px}
.pd-h{font-size:var(--t4);color:var(--muted);margin-bottom:10px;font-weight:500}
.crowned{display:block;width:100%;text-align:center;background:linear-gradient(180deg,#fff6dc,transparent);border:1px solid #ecc98f;border-radius:14px;padding:14px 14px 12px;margin-bottom:12px}
body[data-theme="dark"] .crowned{background:linear-gradient(180deg,#3a2f17,transparent);border-color:#6b5426}
body[data-theme="dark"] .ceremony{background:linear-gradient(135deg,#3a2f17,#33261a);border-color:#6b5426;color:#f1dfb8}
.crowned .crown{font-size:30px;display:block}
.crowned blockquote{margin:6px 0;font-family:var(--serif);font-size:var(--t2);line-height:1.7;word-break:keep-all}
.crowned small{color:var(--muted);font-size:var(--t4)}
.cands{display:grid;gap:8px}
.cand{display:flex;align-items:center;gap:8px}
.cand .md{font-size:var(--t1);flex:none}
.cq{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.cq .qt,.famer .qt,.cer .qt{font-family:var(--serif);font-size:var(--t3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cq .qm,.famer .qm,.cer .qm{font-size:var(--t4);color:var(--muted)}
.crownbtn{width:38px;height:38px;border-radius:50%;border:1px dashed var(--line);font-size:var(--t2);flex:none;filter:grayscale(.6)}
.fame{display:grid;gap:8px}
.famer{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.famer.year{border-color:#ecc98f}.famer.month{border-left:3px solid #d9934f}
.famer .ft{font-size:var(--t4);font-weight:700;color:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.bdg .bi{font-size:26px;filter:grayscale(1);opacity:.35}
.bdg b{font-size:var(--t4);opacity:.55}
.bdg small{font-size:var(--t4);color:var(--muted);line-height:1.35}
.bdg.got{border-color:var(--accent);background:var(--card)}
.bdg.got .bi{filter:none;opacity:1}.bdg.got b{opacity:1}
.rules{display:grid;gap:6px;font-size:var(--t3)}
.rules b{display:inline-block;min-width:44px;color:var(--accent)}
.cer-h{text-align:center;margin-bottom:12px}
.cer-ic{font-size:44px;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.cer-list{display:grid;gap:8px}
.cer{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 12px 10px 44px;position:relative;border:1px solid var(--line);background:var(--card);border-radius:12px;opacity:0;animation:rise .5s ease-out forwards}
.cer .md{position:absolute;left:10px;top:10px;font-size:var(--t1)}
.cer:hover,.cer:focus{border-color:var(--accent)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.tabs button{font-size:var(--t4)}
/* game 2 */
.quests{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.qh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.qh small{color:var(--muted);font-size:var(--t4)}
.qq{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.qq:first-of-type{border-top:0}
.qi{font-size:var(--t1);width:28px;text-align:center}
.qn{flex:1;font-size:var(--t3);display:flex;flex-direction:column;gap:4px}
.qbar{height:5px;background:var(--soft2);border-radius:99px;overflow:hidden;display:block}
.qbar i{display:block;height:100%;background:var(--accent)}
.qq.done .qbar i{background:var(--green)}
.qv{font-size:var(--t4);color:var(--muted)}
.qok{font-size:var(--t4);color:var(--green);font-weight:700}
.quests .hint{margin-top:6px}
.letterb{background:linear-gradient(135deg,#f3ece0,#ebe0cf);border-color:#d8c6a6;color:#3d3122}
.report-b{background:linear-gradient(135deg,#e6efe9,#dbe8e1);border-color:#b9d1c4;color:#25392f}
body[data-theme="dark"] .letterb{background:linear-gradient(135deg,#2e2820,#29231b);border-color:#4d4231;color:#eadfca}
body[data-theme="dark"] .report-b{background:linear-gradient(135deg,#1f2b25,#1b2620);border-color:#34493e;color:#cfe3d8}
.letter{background:#fbf7ee;border:1px solid #e7dcc6;border-radius:12px;padding:18px 18px 14px;margin-bottom:12px;background-image:repeating-linear-gradient(transparent 0 31px,rgba(180,150,110,.18) 31px 32px)}
body[data-theme="dark"] .letter{background-color:#26221c;border-color:#3d362c;background-image:repeating-linear-gradient(transparent 0 31px,rgba(200,170,120,.08) 31px 32px)}
.lt-h{font-size:var(--t4);color:var(--accent);font-weight:700;margin-bottom:10px}
.lt-body{font-family:var(--serif);font-size:var(--t3);line-height:2.06;white-space:pre-wrap;word-break:keep-all}
.wdots span.ice i{background:#9ccbe6}
.chline{font-size:var(--t4);color:#b8742f;font-weight:500;margin-top:4px}
.chbox{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:var(--t3)}
.chbox b{display:block}
.chbox small{display:block;font-size:var(--t4);color:var(--muted);margin-top:2px}
.chbox.start{border-style:dashed;color:var(--accent);font-weight:500}
.chbox.on{border-color:#e2b27a}
.chbox.on .prog{margin-top:6px}
.chbox.ok{border-color:var(--green);background:var(--tag-g)}
.chbox.late{border-color:var(--banner-line);background:var(--banner)}
.chbox .link{margin-top:6px;font-size:var(--t4);color:var(--muted)}
.chopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.chopts button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left}
.chopts b{display:block;font-size:var(--t3)}
.chopts small{font-size:var(--t4);color:var(--muted)}
.rp-hero{background:linear-gradient(135deg,#10a58e,#3fa6d6);color:#fff;border-radius:18px;padding:20px;margin:6px 0 12px}
.rp-hero small{opacity:.85;font-size:var(--t4)}
.rp-hero h1{color:#fff;margin:6px 0 0;font-size:var(--t1)}
.rp-hero h1 b{font-size:var(--t1)}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.rp-grid div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.rp-grid b{display:block;font-family:var(--serif);font-size:var(--t1)}
.rp-grid span{font-size:var(--t4);color:var(--muted)}
.rp-emo{display:flex;gap:8px;flex-wrap:wrap}
.rp-emo span{border-radius:999px;padding:6px 14px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.rp-emo .e0{font-size:var(--t2)}.rp-emo .e1{font-size:var(--t3)}.rp-emo .e2{font-size:var(--t4)}
.rp-emo small{font-weight:400;opacity:.8}
.rp-bars{display:flex;align-items:flex-end;gap:5px;height:110px}
.rp-bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.rp-bars i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.rp-bars small{font-size:var(--t4);color:var(--muted)}
.rp-book{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 0;border-top:1px solid var(--line);font-family:var(--serif)}
.rp-book:first-of-type{border-top:0}
.rp-book span:nth-child(2){flex:1}
.rp-book small{font-family:var(--sans);color:var(--muted);font-size:var(--t4)}
.toggle{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
.toggle b{display:block;font-size:var(--t3)}
.toggle small{font-size:var(--t4);color:var(--muted)}
.fontrow button{font-size:var(--t3)}
/* v8 */
.tabs button{position:relative}
.tdot{display:none;position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:#ff6b6b}
.manualLink{display:block;margin:-2px 0 12px;font-size:var(--t4);color:var(--accent);padding:6px 0}
.onboard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:8px 0 16px;box-shadow:var(--shadow)}
.onboard h1{margin:0 0 14px;font-size:var(--t1)}
.obs{display:grid;gap:12px;margin-bottom:16px}
.obi{display:flex;gap:12px;align-items:flex-start}
.obi b{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--serif)}
.obi span{font-size:var(--t4);color:var(--muted);display:flex;flex-direction:column}
.obi strong{font-size:var(--t3);color:var(--ink);font-weight:700}
.btn.wide{display:block;width:100%;padding:13px;font-size:var(--t3)}
.more-d{border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:14px;background:var(--card)}
.more-d summary{padding:11px 0;font-size:var(--t3);list-style:none;display:flex;align-items:center;gap:6px;cursor:pointer}
.more-d summary::-webkit-details-marker{display:none}
.more-d summary span{margin-left:auto;font-size:var(--t4);color:var(--accent)}
.more-d[open] summary span::after{content:" ▴"}
.more-d:not([open]) summary span::after{content:" ▾"}
.subacts{display:flex;justify-content:space-between;margin-top:10px}
.subacts .link{color:var(--muted);font-size:var(--t3);padding:8px 2px}
.stopw{align-self:flex-start;color:var(--muted);font-size:var(--t4);padding:2px 4px}
.mk-steps{display:grid;gap:4px;font-size:var(--t4);color:#9fb3b0;text-align:left}
.mk-steps .ok{color:#7fe0cc}.mk-steps .cur{color:#fff;font-weight:700}
article.quote{cursor:pointer}
.chip{padding:7px 14px;min-height:34px}
.sortsel,.vt{min-height:34px;padding:6px 10px}
.quick button{padding:8px 13px;font-size:var(--t4)}
.heart{min-width:44px;min-height:36px}
.more{width:36px;height:36px}
.link{padding:6px 0}
.gear{width:38px;height:38px}
.erow{min-height:30px}
.seg button{min-height:38px}
.scanbig{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--accent);color:#fff;border-radius:16px;padding:18px;margin-bottom:6px;box-shadow:0 8px 20px rgba(16,165,142,.3)}

/* v10: buttons unified */
.btn{background:var(--accent);color:#fff}

#toast{background:#1d2a2c;color:#fff}
/* sheet handle */

/* view enter */

/* records tools */

/* ================= v12 UI 정리 ================= */
/* 1) 글자 크기 4단계 · 8배수 여백 */
:root{--fs-d:var(--t1);--fs-t:var(--t2);--fs-b:var(--t3);--fs-c:var(--t4)}
h1{font-size:var(--fs-d);font-weight:700;letter-spacing:-.025em;font-family:var(--sans)}
h2{font-size:var(--fs-t);font-weight:700;letter-spacing:-.01em}
.psub,.hint,.meta,.qm,.lr-m,.g-a,.g-m,.r-a,.now-p,.jn-b,.jn-d,.tb-s,.bk-note,.bk-meta span,.rcount,.d,.dates,.bk-dates,.cnt,.qq small,.lvs{font-size:var(--fs-c)!important}
.tb-m,.g-t,.tt,.way b,.t-h b{font-size:var(--fs-t)}
main{padding:8px 20px 24px}
.row{margin:24px 0 12px}
/* 2) 카드: 테두리 대신 부드러운 그림자, 더 둥글게 */
:root{--shadow:0 1px 2px rgba(20,40,38,.04),0 8px 24px rgba(20,40,38,.06);--r:20px}
body:not([data-theme="dark"]) :is(.quote,.rcard,.now,.lrow,.qrow,.talk,.bk-prog,.podium,.jstats div,.ef,.jguide,.jnar,.bk-hero,.detail .card,.emap,.quests,.chbox,.recitem,.candb,.way,.tcard,.aic-i,.isbnbox,.lvcard,.empty){border-color:transparent}
:is(.quote,.rcard,.now,.lrow,.talk,.bk-prog,.jstats div,.ef,.jguide,.jnar,.detail .card,.emap,.way,.tcard,.aic-i,.lvcard){box-shadow:var(--shadow)}
.quote,.rcard,.now,.bk-hero,.jnar,.jguide,.detail .card{border-radius:var(--r)}
.lrow,.qrow,.ef,.jstats div,.bk-prog{border-radius:16px}
.empty{background:var(--soft);border-style:solid}
.quote{padding:18px 18px 14px}
.qactions{border-top-color:var(--soft2)}
/* 3) 포인트 색은 주요 버튼 하나만: 선택·태그·링크는 무채색 */
.chip.on,.optrow button.on,.stpick input:checked+span{background:var(--inkbg);color:var(--onink);border-color:var(--inkbg)}
.tag{background:var(--soft2);color:var(--ink2)}
.link,.rt-link,.bp-top em,.pd-h,.now-l{color:var(--ink2)}
.rt-link{text-decoration:underline;text-underline-offset:3px}
.r-acts button{background:var(--soft);color:var(--ink2)}
.r-acts button:first-child{background:var(--soft);color:var(--ink)}
.stpill{background:var(--soft2);color:var(--ink)}
.talkbtn,.talkbtn.resume{background:var(--soft);color:var(--ink);font-weight:700}
.talkbtn.resume{box-shadow:inset 0 0 0 1.5px var(--ink2)}
.heart{border-color:transparent;background:var(--soft)}
.aitag{background:var(--soft2);color:var(--ink2)}
.rt-ic.on,.rt-f.on{border-color:var(--inkbg);color:var(--ink);background:var(--soft)}
.lr-e i,.ecloud span{filter:saturate(.75)}
.jn.life-dot .jn-d{color:var(--ink)}
/* 4) 손으로 그은 형광펜 */
mark,.quote blockquote mark,.today blockquote mark{color:inherit;background:transparent;margin:0 -.15em;padding:.05em .2em;border-radius:.6em .25em .5em .3em;
  background-image:linear-gradient(100deg,transparent .6%,color-mix(in srgb,var(--hl) 75%,transparent) 2%,var(--hl) 5%,var(--hl) 92%,color-mix(in srgb,var(--hl) 80%,transparent) 99%,transparent 100%);
  background-repeat:no-repeat;background-size:100% 58%;background-position:0 88%;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.sweep{animation:sweep .9s cubic-bezier(.3,.7,.2,1) both}
@keyframes sweep{from{background-size:0% 58%}to{background-size:100% 58%}}
/* 5) 떠 있는 탭 막대 */
.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border-radius:24px;border:1px solid var(--line);background:var(--tabbg);
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 10px 30px rgba(20,40,38,.14);max-width:560px;margin:0 auto}
.tabs .in{gap:4px}
.tabs button{border-radius:18px;padding:8px 0 7px;transition:background .2s,color .2s}
.tabs button.on{background:var(--soft2);color:var(--ink)}
.tabs button svg{width:21px;height:21px}
#app{padding-bottom:110px}
.fabs{bottom:calc(92px + env(safe-area-inset-bottom))}
/* 6) 큰 제목 → 내리면 작은 머리글 */
.top{position:sticky;top:0;z-index:7;background:transparent;transition:background .2s,box-shadow .2s;padding:14px 20px 8px}
body.scrolled .top{background:var(--tabbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.hdt{position:absolute;left:50%;transform:translateX(-50%);font-weight:700;font-size:var(--t3);opacity:0;transition:opacity .2s;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
body.scrolled.has-ht .hdt{opacity:1}
body.scrolled.has-ht .brand{opacity:0}
.brand{transition:opacity .2s}
.syncdot{width:10px;height:10px;border-radius:50%;background:transparent;margin-right:4px;padding:0}
.syncdot.on{background:#f4a261;box-shadow:0 0 0 4px color-mix(in srgb,#f4a261 25%,transparent)}
#sync{display:block}
.rbtns{display:flex;gap:6px}
/* 7) 별 모티프 */
.star{color:#e9b130;margin-right:4px;font-size:var(--t4)}
.starb.on{background:#fff6d8;color:#8a6a12}
body[data-theme="dark"] .starb.on{background:#3a3218;color:#f2d27a}
/* 캡처 고르기 · 붙여넣기 · 바로 고치기 · 다음 단계 */
.cap-h{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.cap-h small{display:block;font-size:var(--t4);color:var(--muted)}.cap-h b{font-size:var(--t2)}
.caps{display:grid;gap:8px;margin-bottom:6px}
.capb{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.capb span{grid-row:1/3;font-size:24px;width:40px;height:40px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.capb b{font-size:var(--t3)}.capb small{font-size:var(--t4);color:var(--muted)}
.capb.pri{background:var(--accent);color:#fff}.capb.pri small{color:rgba(255,255,255,.85)}.capb.pri span{background:rgba(255,255,255,.18)}
.chat-quote{display:flex;gap:8px;align-items:flex-start}
.chat-quote span{flex:1}
.cq-edit{flex:none;font-size:var(--t4);color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:2px 0;font-family:var(--sans)}
.chat-quote.editing{display:block;max-height:none}
.chat-quote textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);resize:vertical}
.cq-a{display:flex;justify-content:flex-end;gap:12px;align-items:center;margin-top:6px}
.nextcard{background:var(--card);border-radius:var(--r);padding:16px;margin:4px 0 14px;box-shadow:var(--shadow)}
.nextcard .lbl{font-size:var(--t4);color:var(--muted);font-weight:700;margin-bottom:8px}
.nx{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:var(--t3)}
.nx .btn,.nx .heart{min-width:44px}

/* v13 */
.pt{margin:6px 0 4px}
.collect{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;margin-top:16px;border-radius:16px;background:var(--accent);color:#fff;font-size:var(--t2);font-weight:700;box-shadow:0 8px 20px rgba(16,165,142,.28)}
.collect.solo{margin:8px 0 14px}
.now-row{cursor:pointer}
.now .now-acts{margin-top:8px}
.oread{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;margin:-4px 0 12px;padding:2px 0}
.oread span{font-size:var(--t4);color:var(--muted);white-space:nowrap;margin-right:2px}
.oread button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 12px;font-size:var(--t4)}
.oread i{width:8px;height:12px;border-radius:2px;background:var(--c)}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 8px;scroll-snap-type:x mandatory}
.scard{flex:0 0 200px;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:120px;text-align:left;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.scard .sq{font-family:var(--serif);font-size:var(--t3);line-height:1.6;word-break:keep-all}
.scard .sb{font-size:var(--t4);color:var(--muted);display:flex;align-items:center;gap:5px}
.think{background:var(--card);border-radius:var(--r);padding:18px;margin:0 0 16px;box-shadow:var(--shadow)}
.think .lbl{font-size:var(--t4);font-weight:700;color:var(--muted);margin-bottom:8px}
.think blockquote{margin:0;font-family:var(--serif);font-size:var(--t2);line-height:1.75;cursor:pointer;word-break:keep-all}
.think .src{font-size:var(--t4);color:var(--muted);margin-top:8px}
.think .ask{font-size:var(--t4);color:var(--ink2);margin:12px 0 12px;padding-left:10px;border-left:2px solid var(--line)}
.think .btn{width:100%;height:44px}
.ob-motto{font-family:var(--serif);font-size:var(--t2);font-weight:700;margin-bottom:14px}
.gd-h small{font-size:var(--t4);color:var(--muted)}.gd-h h3{margin:2px 0 14px;font-family:var(--serif);font-size:var(--t2)}
.gd-s{display:flex;gap:12px;margin-bottom:14px}
.gd-s .n{width:28px;height:28px;border-radius:50%;background:var(--soft2);display:flex;align-items:center;justify-content:center;flex:none;font-size:var(--t4)}
.gd-s strong{font-size:var(--t3)}
.gd-s p{margin:2px 0 6px;font-size:var(--t4);color:var(--ink2)}
.gd-s ul{margin:0;padding-left:16px;font-size:var(--t4);color:var(--ink2);line-height:1.6}
.gd-s li{margin-bottom:3px}
.gd-note{background:var(--soft);border-radius:14px;padding:12px 14px;margin:4px 0 14px}
.gd-note strong{font-size:var(--t4)}.gd-note p{margin:4px 0 0;font-size:var(--t4);color:var(--ink2)}

/* v14 채집 정리 */
.hero2{background:var(--card);border-radius:24px;padding:16px 16px 16px;box-shadow:var(--shadow);margin:8px 0 8px;background-image:linear-gradient(170deg,color-mix(in srgb,var(--c) 12%,transparent),transparent 55%)}
.h2-top{display:flex;justify-content:space-between;align-items:center;font-size:var(--t4);color:var(--muted);font-weight:700;margin-bottom:12px}
.h2-sw{font-size:var(--t4);color:var(--ink2);background:var(--soft);border-radius:999px;padding:5px 10px}
.h2-row{display:flex;gap:14px;align-items:center;cursor:pointer}
.h2-i{flex:1;min-width:0}
.h2-prog{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;font-size:var(--t4);color:var(--muted)}
.h2-prog .bar{flex:1;height:6px;background:var(--soft2);border-radius:99px;overflow:hidden}
.h2-prog .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.h2-prog span{font-weight:700;color:var(--ink)}.h2-prog .muted{font-weight:400;color:var(--muted)}
.hero2 .collect{margin-top:14px}
.addic{width:34px;height:34px;border-radius:50%;background:var(--soft2);font-size:var(--t2);color:var(--ink);display:flex;align-items:center;justify-content:center}
.recrow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font-size:var(--t4);background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:12px;color:var(--ink2)}
.rcard.slim{align-items:center;padding:12px 14px;gap:12px}
.rcard.slim .tb-m{font-size:var(--t3);-webkit-line-clamp:1}
.rcard.slim .r-a{margin-top:2px}
.r-cam{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none}
.books{gap:8px}

/* v15 */
.cd-h{font-size:var(--t4);color:var(--muted);font-weight:700;margin-bottom:10px}
.cd blockquote{margin:0 0 16px;font-family:var(--serif);font-size:var(--t2);line-height:1.75;word-break:keep-all}
.cd-q{font-size:var(--t4);font-weight:700;margin-bottom:8px}
.moods{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.moods button{border-radius:999px;padding:7px 13px;font-size:var(--t4);background:var(--soft);color:var(--ink2)}
.moods button.on{background:var(--inkbg);color:var(--onink)}
.whisper{display:flex;flex-direction:column;gap:4px;background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:14px;border-left:3px solid var(--accent)}
.whisper:empty{display:none}
.whisper.solo{margin:0 0 12px}
.w-who{font-size:var(--t4);color:var(--muted);font-weight:700}
.w-t{font-family:var(--serif);font-size:var(--t3);line-height:1.65;color:var(--ink)}
.moodt{display:inline-block;font-size:var(--t4);font-weight:700;color:var(--e);background:color-mix(in srgb,var(--e) 14%,transparent);border-radius:99px;padding:1px 7px;margin-right:5px;vertical-align:1px}
.lf-ins{margin-top:12px;position:relative;z-index:1}
.lf-ins summary{cursor:pointer;font-size:var(--t4);color:#bff3e6;font-weight:700}
.lf-ins p{font-family:var(--serif);font-size:var(--t3);line-height:1.85;margin:8px 0 0;white-space:pre-wrap;opacity:.95}
.lf-ins-btn{position:relative;z-index:1;margin-top:12px;font-size:var(--t4);color:#bff3e6;text-decoration:underline;text-underline-offset:3px}
.lf-re{position:relative;z-index:1;margin-top:14px;background:rgba(255,255,255,.1);border-radius:14px;padding:12px}
.lf-re b{display:block;font-size:var(--t4);color:#fde68a}.lf-re span{font-size:var(--t3)}
.lf-re div{display:flex;gap:6px;margin-top:10px}
.lf-re button{flex:1;height:36px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font-size:var(--t4);font-weight:700}
.weave{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.weave b{font-size:var(--t3)}.weave span{font-size:var(--t4);color:var(--muted)}
.chapters{display:grid;gap:10px;margin-bottom:14px}
.chap{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.ch-n{flex:none;font-family:var(--serif);font-size:var(--t4);font-weight:700;color:var(--muted);writing-mode:vertical-rl;letter-spacing:.1em;border-right:1px solid var(--line);padding-right:10px}
.ch-b{flex:1;min-width:0}
.ch-b b{font-family:var(--serif);font-size:var(--t2)}
.ch-b p{margin:4px 0 8px;font-size:var(--t4);color:var(--ink2)}
.ch-q{display:block;text-align:left;font-family:var(--serif);font-size:var(--t4);line-height:1.55;color:var(--ink2);padding:3px 0}
.ch-b small{font-size:var(--t4);color:var(--muted)}

.brand{display:flex;align-items:baseline;gap:8px;font-size:var(--t1)}
.brand .motto{font-family:var(--sans);font-size:var(--t4);font-weight:500;color:var(--muted);letter-spacing:.04em}
.who .voice{font-weight:500;color:var(--muted);font-size:var(--t4)}

/* v16 체계: 섹션 머리 · 그룹 목록 · 텍스트 탭 */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 2px 10px}
.sec>span{font-size:var(--t4);font-weight:700;color:var(--ink2);letter-spacing:.01em;display:flex;align-items:center;gap:6px}
.sec .cnt2{font-style:normal;font-weight:500;color:var(--muted);font-size:var(--t4)}
.sec-a{font-size:var(--t4);color:var(--muted);font-weight:500}
.sec-n{font-size:var(--t4);color:var(--muted)}
.glist{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
body[data-theme="dark"] .glist{border:1px solid var(--line)}
.grow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px 14px 16px;position:relative;cursor:pointer}
.grow+.grow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--soft2)}
.grow:active{background:var(--soft)}
.l-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.l-q{font-family:var(--serif);font-size:var(--t3);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.l-q.sm{font-size:var(--t4);color:var(--ink2);-webkit-line-clamp:1}
.l-t{font-size:var(--t3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-m{font-size:var(--t4);color:var(--muted);display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.l-m .mcv{margin-right:4px}
.chev{flex:none;color:var(--line);font-size:var(--t1);line-height:1}
.brow .cover{margin:0}
.ttabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto;scrollbar-width:none}
.ttabs button{position:relative;padding:10px 0 11px;font-size:var(--t3);color:var(--muted);font-weight:700;white-space:nowrap}
.ttabs button em{font-style:normal;font-size:var(--t4);margin-left:4px;color:var(--muted);font-weight:500}
.ttabs button.on{color:var(--ink)}
.ttabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.statbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 0;margin:0 0 6px}
.statbar div{text-align:center;position:relative}
.statbar div+div::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--soft2)}
.statbar b{display:block;font-size:var(--t1);font-weight:700}
.statbar span{font-size:var(--t4);color:var(--muted)}
.rtools{margin:0 0 12px}
.think{margin:0 0 6px}
.ceremony{margin:0 0 12px}
main .pt{font-size:var(--t1);letter-spacing:-.03em}
.psub{margin-bottom:16px}

.ceremony{padding:10px 14px;border-radius:14px}
.ceremony>span:first-child{font-size:20px}
.ceremony b{font-size:var(--t4)}.ceremony small{font-size:var(--t4)}
.ecloud span{font-size:var(--t4)!important;padding:3px 10px}
.ef{flex:0 0 58px;box-shadow:none;background:var(--card);border:1px solid var(--soft2)!important}

/* v17 panel: 모든 구역을 같은 카드 안에 */
.blk,.hero2,.statbar,.weave,.revisit,.jnar{border-radius:22px}
.blk{background:var(--card);box-shadow:var(--shadow);padding:16px 0 6px;margin:12px 0 0;overflow:hidden}
.blk.nohead{padding-top:4px}
.blk>.sec{margin:0 16px 4px;align-items:center}
.blk>.sec>span:first-child,.h2-top>span{font-size:var(--t4);font-weight:700;color:var(--ink);letter-spacing:0}
.h2-top{margin-bottom:14px}
.hero2{margin:8px 0 0;padding:16px}
.blk .glist{background:none;box-shadow:none;border-radius:0}
.blk .grow{padding:13px 16px}
.blk .ttabs{margin:2px 16px 4px;gap:16px}
.blk .ttabs button{font-size:var(--t4);padding:9px 0 10px}
.blk .bgrid{padding:12px 16px 12px}
.blk .recrow{width:auto;margin:10px 16px 6px}
.blk .pempty{text-align:center;color:var(--muted);font-size:var(--t4);padding:22px 16px 18px}
.blk .chapters,.blk .eflow,.blk .ecloud,.blk .journey{margin-left:16px;margin-right:16px}
.blk .eflow{padding:6px 0 4px}
.blk .ecloud{margin-bottom:12px}
.blk .journey{padding-top:6px}
.blk .link{display:block;margin:0 0 10px 42px!important}
.statbar{margin:12px 0 0}
.l-m{flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.l-m .l-b{overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1}
.l-m .mcv,.l-m .moodt{flex-shrink:0}
.l-m>*{flex-shrink:0}
.l-m .l-b{flex-shrink:1}
.emap,.revisit,.jguide{border-radius:22px}
.emap>.lbl,.revisit>.lbl,.jguide>.lbl,.rv-l{font-size:var(--t4)!important;font-weight:700!important;color:var(--ink)!important;letter-spacing:0!important;text-transform:none!important}

.ptools{display:flex;align-items:center;gap:6px}
.pt-ic,.pt-f{display:inline-flex;align-items:center;gap:5px;height:30px;border-radius:999px;background:var(--soft);color:var(--ink2);font-size:var(--t4);font-weight:500;padding:0 11px;white-space:nowrap}
.pt-ic{width:30px;padding:0;justify-content:center}
.pt-ic.on,.pt-f.on{background:var(--ink);color:var(--card)}
.rblk>.sec{margin-bottom:8px}
.psearch{margin:0 16px 8px}
