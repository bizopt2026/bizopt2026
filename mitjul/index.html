.vs-what{background:var(--card);border-radius:14px;padding:12px 14px;margin:4px 0 18px}
.vs-what b{font-size:var(--t3)}.vs-what p{margin:4px 0 0;font-size:var(--t4);line-height:1.7;color:var(--ink)}
.vs-h{font-size:var(--t2);margin:0 0 10px}
.vs-steps{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:10px}
.vs-st{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.vs-st .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent,#fff);display:flex;align-items:center;justify-content:center;flex:none;font-size:var(--t4);font-weight:700;font-family:var(--f-body)}
.vs-st.done .n{background:#4E8C84}
.vs-st b{font-size:var(--t3)}.vs-st p{margin:3px 0 0;font-size:var(--t4);line-height:1.65;color:var(--ink)}
.vs-st .btn{margin-top:8px}
.vs-sm{font-size:var(--t4)!important;color:var(--muted)!important}
.vs-faq{background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:var(--t4)}
.vs-faq summary{cursor:pointer;font-weight:700;color:var(--ink)}
.vs-faq p{margin:8px 0 2px;line-height:1.7;color:var(--ink)}
.vs-faq .vs-steps{margin-top:10px}.vs-faq .vs-st{background:var(--paper)}
.vs-act{display:flex;gap:8px;margin-top:14px}.vs-act .btn{flex:1}
.gd-gift{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:6px 0 12px}
.gd-gift summary{cursor:pointer;font-weight:700;font-size:var(--t3)}
.gd-gh{display:block;margin:12px 0 6px;font-size:var(--t4);color:var(--muted)}
.gd-gl{margin:0;padding-left:18px;font-size:var(--t4);line-height:1.7;color:var(--ink)}
.gd-gift .vs-st{background:var(--paper)}
/* ===== UX 정리 (상세 버튼 · 첫 화면 · 탭 · 대비 · 카드 모양) ===== */
:root{--muted:#585D72;--r:16px;--r-s:12px}
body[data-theme="dark"]{--muted:#A7ADC4}
/* ⑩ 카드 모양: 큰 카드 16px · 목록 줄·작은 상자 12px */
.card,.detail .card,.think,.blk,.glist,.now,.hero2,.meet,.gf-card,.gf-think,.vs-what,.vs-lock,.vs-code,.vs-st,.empty,.recbanner,.ceremony{border-radius:var(--r)}
.gf-page,.vs-faq,.gf-steps,.resrow .seg3,.sh-seg{border-radius:var(--r-s)}
/* ① 상세 버튼 */
.qcard{position:relative;padding-right:44px!important}
.qmore{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;font-size:var(--t1);line-height:1;color:var(--muted);display:flex;align-items:center;justify-content:center}
.qmore:active{background:var(--soft)}
.qact{display:grid;gap:8px;margin:4px 0 22px}
.qmain{height:50px;font-size:var(--t3);gap:8px;display:flex;align-items:center;justify-content:center}
.qmain.resume{background:var(--accent)}
.qsub{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.qs{min-height:44px;border-radius:var(--r-s);background:var(--card);border:1px solid var(--line);font-size:var(--t4);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 14px}
.qs.on,.qs.starb.on{background:var(--hl-soft,#FBF1C9);border-color:transparent;color:var(--ink);font-weight:700}
.qs.heart{min-width:60px}
.sm-empty{display:flex;flex-direction:column;align-items:center;gap:10px;line-height:1.6}
/* ② 오늘 다시 만나는 한 줄 */
.meet{display:block;background:var(--card);box-shadow:var(--shadow);padding:16px 16px 14px;margin:0 0 14px;cursor:pointer}
body[data-theme="dark"] .meet{border:1px solid var(--line)}
.meet-h{font-size:var(--t4);font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.meet-h span{font-weight:500;color:var(--muted)}
.meet blockquote{margin:10px 0 8px;font-size:var(--t2);line-height:1.75;word-break:keep-all}
.meet blockquote mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit}
.meet-s{font-size:var(--t4);color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.meet-s span{margin-left:auto;color:var(--accent);font-weight:700}
/* ③ 다시 읽으니: 한 줄 3칸 */
.resrow{display:grid!important;gap:6px}
.resrow>span{font-size:var(--t4);color:var(--muted)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);padding:3px;gap:3px}
.seg3 button{border-radius:9px!important;min-height:38px!important;padding:0!important;background:none!important;font-size:var(--t4)!important;color:var(--ink)!important}
.seg3 button.on{background:var(--inkbg)!important;color:var(--onink)!important;font-weight:700}
/* ⑤ 상세 머리말 */
.top .brand.isdetail{display:flex;align-items:center;gap:2px;min-width:0;flex:1;font-size:var(--t2)}
.hback{width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink);flex:none}
.hback:active{background:var(--soft)}
.htl{font-size:var(--t2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.has-hb main .detail>.back:first-child,.has-hb main>.back:first-child{display:none}
.brand .motto{margin-left:8px}
.topr .gear{min-width:40px;min-height:40px}
/* ⑥ 탭: 짧은 이름 + 형광펜 */
.tabs button{font-size:var(--t4)!important;gap:3px}
.tabs button svg{width:24px!important;height:24px!important}
.tabs button.on::before{display:none}
.tabs .tl{padding:0 3px;line-height:1.3}
.tabs button.on .tl{background:linear-gradient(transparent 55%,var(--hl) 55%);color:var(--ink)}
body[data-theme="dark"] .tabs button.on .tl{background:linear-gradient(transparent 55%,rgba(247,220,111,.45) 55%)}
/* ⑦ 사유 탭: 이번 달 접기 */
.mfold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}
.mfold>summary::-webkit-details-marker{display:none}
.mfold>summary .fold-i{margin-left:auto;transition:transform .2s;color:var(--muted)}
.mfold[open]>summary .fold-i{transform:rotate(180deg)}
.mfold:not([open]){padding-bottom:14px}
/* ⑧ 선물 탭 */
.gf-how{word-break:keep-all}
.gf-h .btn.accent{margin-bottom:8px}
.gsm{margin:4px 0 14px;text-align:center}
.gsm-c{background:#FBF8F1;color:#2A2620;border-radius:var(--r-s);padding:12px 14px 10px;text-align:left;box-shadow:0 6px 18px rgba(40,30,10,.1);max-width:300px;margin:0 auto}
.gsm-t{font-size:var(--t4);color:#A39C8C;text-align:center;border-bottom:1px solid #E9E2D2;padding-bottom:6px;margin-bottom:6px}
.gsm-c .gf-page{background:none;box-shadow:none;padding:4px 0;color:#2A2620}
.gsm-c .gf-page blockquote{font-size:var(--t3)}
.gsm-c .gf-ctx{font-size:var(--t4);color:#B5AE9F;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gsm-f{display:flex;justify-content:space-between;align-items:flex-end;font-size:var(--t4);color:#8C8577;margin-top:6px}
.gsm-qr{width:34px;height:34px;border-radius:4px;background:conic-gradient(#1E2235 25%,#fff 0 50%,#1E2235 0 75%,#fff 0) 0 0/8px 8px;outline:3px solid #fff;box-shadow:0 0 0 4px #E9E2D2}
.gsm small{display:block;margin-top:8px;font-size:var(--t4);color:var(--muted)}
body[data-theme="dark"] .gsm-c{background:#211F1A;color:#E8E2D4}
body[data-theme="dark"] .gsm-c .gf-page{color:#E8E2D4}
.gpick{max-height:60vh;overflow:auto;margin-bottom:8px}
.gpick .grow{width:100%;text-align:left}
/* 보내기 시트 세그먼트 */
.sh-seg{display:grid!important;grid-template-columns:1fr 1fr;background:var(--soft);padding:3px;gap:3px}
.sh-seg button{border-radius:9px!important;background:none!important;border:0!important;min-height:40px}
.sh-seg button.on{background:var(--card)!important;box-shadow:0 1px 3px rgba(20,24,50,.12);font-weight:700;color:var(--ink)}
/* ⑨ 대비·최소 글자 */
.l-m,.rcount,.sec-n,.g-a,.tb-s,.now-p,.lr-m,.jn-b,.jn-d,.src{font-size:var(--t4)!important}
.hint,.l-m,.src,.meta{color:var(--muted)}
/* ===== 글자 체계: 한 가지 글꼴 · 네 가지 크기 · 세 가지 굵기 =====
   t1 22  화면 제목 · 큰 숫자     t2 17  카드 제목 · 밑줄 문장
   t3 15  본문 · 버튼             t4 13  날짜·출처·태그·작은 버튼·탭
   굵기 400 본문 / 500 보조 강조 / 700 제목 · 숫자는 같은 글꼴의 고정폭 숫자 */
:root{--t1:22px;--t2:17px;--t3:15px;--t4:13px}
html,body,button,input,textarea,select{font-family:var(--f-body)}
body{font-size:var(--t3)}
h1{font-size:var(--t1)}h2{font-size:var(--t2)}h3{font-size:var(--t2)}
.num,b,strong{font-variant-numeric:tabular-nums}
input,textarea,select{font-size:max(16px,var(--t3))}
/* ===== 러닝 훈련 앱 디자인 언어 적용 =====
   남색 상단 바 · 테두리만 있는 납작한 흰 카드 · 또렷한 인디고 강조색 · 활성 탭 둥근 배경 · 노란 형광펜은 밑줄 문장에만 */
:root{--paper:#F3F5F9;--card:#FFFFFF;--ink:#141A2E;--ink2:#2E3650;--muted:#4F5A70;--line:#DDE3EE;
  --accent:#4A4FD1;--accent-soft:#ECEDFC;--on-accent:#FFFFFF;--inkbg:#141A2E;--onink:#FFFFFF;
  --soft:#EEF1F7;--soft2:#E3E8F1;--hdr:#141A2E;--hdr-fg:#FFFFFF;--hdr-sub:#C9CCFF;--r:14px;--r-s:10px;--shadow:none;--tabbg:#FFFFFF}
body[data-theme="dark"]{--paper:#0B1020;--card:#151C2F;--ink:#E8ECF5;--ink2:#C9D0E2;--muted:#AAB3C7;--line:#263049;
  --accent:#9D9CFF;--accent-soft:#25264A;--on-accent:#10131F;--inkbg:#E8ECF5;--onink:#10131F;
  --soft:#1B2338;--soft2:#232C44;--hdr:#060A16;--hdr-fg:#E8ECF5;--hdr-sub:#B9B8FF;--tabbg:#151C2F}
body{background:var(--paper)}
/* 상단 바 */
.top,body.scrolled .top{background:var(--hdr)!important;color:var(--hdr-fg);box-shadow:none!important;backdrop-filter:none!important;padding:10px 16px!important;min-height:56px}
.top .brand,.top .brand span,.top .brand .bsec,.top .htl{color:var(--hdr-fg)!important}
.top .brand{font-size:var(--t2)!important;gap:6px!important;align-items:center!important}
.top .brand>span:first-child:not(.htl){position:relative;z-index:0}
.top .brand>span:first-child:not(.htl)::after{content:"";position:absolute;left:-2px;right:-2px;bottom:1px;height:6px;border-radius:2px;background:var(--hl);opacity:.9;z-index:-1}
.top .brand .bsec{font-weight:500!important;color:var(--hdr-sub)!important;background:none!important;padding:0!important}
.top .brand .bsec::before,.top .brand .bsec::after{display:none!important}
.top .motto{color:var(--hdr-sub)!important;margin-left:6px}
.top .gear,.top .hback{color:var(--hdr-fg)!important}
.top .gear{width:32px!important;height:32px!important;min-width:32px!important;min-height:32px!important;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;margin-left:8px}
.top .gear svg{width:17px;height:17px}
.top .hback{margin-left:-10px}
.top .syncdot{filter:none}
/* 카드: 납작하게, 1px 테두리 */
.blk,.think,.hero2,.card,.detail .card,.meet,.recbanner,.empty,.gf-card,.gf-think,.vs-what,.vs-lock,.vs-code,.vs-st,.now,.lvcard,.quests,.jguide,.jnar,.emap,.podium,.isbnbox{background:var(--card)!important;background-image:none!important;border:1px solid var(--line)!important;box-shadow:none!important;border-radius:var(--r)!important}
.blk .glist,.think .glist{border:0!important;background:none!important}
main>.glist,.detail>.glist,.lrows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:none}
.grow+.grow,.glist>*+*{border-top:1px solid var(--line)}
.sec{margin:20px 2px 8px!important}
.blk>.sec{margin:0 16px 8px!important}
.sec>span,.fold-h,.row h2,.detail h2{font-size:var(--t2)!important;font-weight:700!important;color:var(--ink)!important}
/* 작은 머리글은 강조색 */
.sm-say,.h2-l,.meet-h,.now-l,.lbl,.detail .lbl{color:var(--accent)!important}
.meet-h span{color:var(--muted)!important}
/* 지금 읽는 책: 남색 히어로 */
.hero2{background:var(--hdr)!important;border-color:var(--hdr)!important;color:var(--hdr-fg)}
.hero2 .h2-l{color:var(--hdr-sub)!important}
.hero2 .h2-t{color:var(--hdr-fg)}
.hero2 .h2-a,.hero2 .h2-prog,.hero2 .h2-prog em{color:rgba(255,255,255,.7)!important}
.hero2 .h2-prog span,.hero2 .h2-prog b{color:var(--hdr-fg)!important}
.hero2 .h2-prog .bar{background:rgba(255,255,255,.16)!important}
.hero2 .h2-prog .bar i{background:var(--hl)!important}
.hero2 .h2-sw{background:rgba(255,255,255,.12)!important;color:var(--hdr-fg)!important}
.hero2 .collect{background:var(--hl)!important;color:#141A2E!important;box-shadow:none!important;border-radius:12px!important;font-weight:700}
.hero2 .collect .ic{color:#141A2E!important}
/* 버튼 */
.btn,.collect,.fab,.scanbig,.capb.pri,.now-acts .pri,.ulbtn,.send,.g-q{background:var(--accent)!important;color:var(--on-accent)!important;box-shadow:none!important}
.btn{border-radius:12px!important;font-weight:700!important}
.btn.small{border-radius:99px!important}
.btn.ghost,.qs{background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line)!important}
.btn.ig{background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888)!important;color:#fff!important}
.collect,.qmain{border-radius:12px!important;height:52px}
.collect .ic,.fab svg,.scanbig .si,.ulbtn .ic,.now-acts .pri .ic{color:var(--on-accent)!important}
.qs .bi{margin-right:2px}
.qs.on,.qs.starb.on{background:var(--accent-soft)!important;border-color:var(--accent)!important;color:var(--accent)!important}
.qs.heart.on{color:#D14F4F!important}
.chip.on,.optrow button.on,.sh-row button.on,.resrow button.on,.seg3 button.on,.stseg button.on,.moods button.on{background:var(--ink)!important;color:var(--paper)!important;border-color:var(--ink)!important}
.seg3,.sh-seg{background:var(--soft)!important}
.sh-seg button.on{background:var(--card)!important;color:var(--ink)!important}
.sec-a,.link{color:var(--accent)!important}
/* 알림 띠(작가의 편지 · 선명이 추천): 강조색 연한 바탕 */
.ceremony,.letterb,.recbanner{background:var(--accent-soft)!important;background-image:none!important;border:1px solid var(--accent)!important;color:var(--ink)!important;box-shadow:none!important}
.ceremony .ic,.letterb .ic{color:var(--accent)}
/* 아래 탭: 흰 바탕, 활성 탭은 둥근 배경 */
.tabs{background:var(--tabbg)!important;backdrop-filter:none!important;border-top:1px solid var(--line)!important;box-shadow:none!important}
.tabs button{color:var(--muted)!important;font-weight:500!important}
.tabs button svg{box-sizing:content-box;padding:3px 16px;border-radius:99px;opacity:1!important;transition:background .2s}
.tabs button.on{color:var(--accent)!important;font-weight:700!important}
.tabs button.on svg{background:var(--accent-soft)}
.tabs button.on .tl{background:none!important;color:var(--accent)!important}
/* 상세 */
.qcard blockquote mark,.meet blockquote mark,.think blockquote mark{background:linear-gradient(transparent 58%,var(--hl) 58%)!important}
.empty{background:var(--card)!important;border-style:dashed!important}
#toast{background:var(--ink);color:var(--paper);border-radius:12px}
.top .htl,.top .htl *{background:none!important;box-shadow:none!important}
body[data-theme="dark"] .hero2{background:#1A2142!important;border-color:#2B3462!important}
body[data-theme="dark"] .hero2 .collect{background:#F7DC6F!important;color:#141A2E!important}
body[data-theme="dark"] .hero2 .h2-prog .bar i{background:#F7DC6F!important}
.bk-hero{background:var(--card)!important;background-image:none!important;border:1px solid var(--line)!important;box-shadow:none!important;border-radius:var(--r)!important}
/* 받는 사람 화면: 러닝 앱 디자인 */
.vs-hd{display:block!important;background:var(--hdr);color:var(--hdr-fg);border-radius:var(--r);padding:20px 18px;margin:12px 0 12px!important}
body[data-theme="dark"] .vs-hd{background:#1A2142;border:1px solid #2B3462}
.vs-hd small{display:block;font-size:var(--t4);font-weight:700;color:var(--hdr-sub)!important;letter-spacing:.02em}
.vs-hd h2{margin:6px 0 6px!important;font-size:var(--t1)!important;line-height:1.3!important;color:var(--hdr-fg)!important}
.vs-hd p{margin:0;font-size:var(--t4);color:rgba(255,255,255,.82)!important}
.vs b,.vs-h,.vs-what b,.vs-st b,.vs-lock b,.vs-faq summary{color:var(--ink)!important}
.vs p,.vs-st p,.vs-what p,.vs-faq p{color:var(--muted)!important;font-weight:400}
.vs-h{font-size:var(--t2)!important;margin:20px 2px 8px!important}
.vs-lock{color:var(--ink)}
/* 단계: 한 장의 카드 안에 번호 목록 */
.vs-steps{gap:0!important;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:2px 16px!important}
.vs-st{background:none!important;border:0!important;border-radius:0!important;padding:14px 0!important}
.vs-st+.vs-st{border-top:1px solid var(--line)!important}
.vs-st .n{background:var(--ink)!important;color:var(--paper)!important;width:24px!important;height:24px!important;font-size:var(--t4)!important}
.vs-st.done .n{background:#2F8F5B!important;color:#fff!important}
.vs-st.done b{color:var(--muted)!important}
.vs-faq{background:var(--card)!important;border:1px solid var(--line);border-radius:var(--r-s)!important}
.vs-faq .vs-steps{border:0;padding:0!important}
.vs-act .btn{height:46px}
.gd-gift .vs-steps{border:0;padding:0!important;background:none}
/* ===== 촘촘하게: 이번 주 보드 · 서재 표지 · 간격 ===== */
.wkb{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;margin:12px 0 0}
.wkb-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.wkb-h b{font-size:var(--t2)}
.wkb-h span{font-size:var(--t4);color:var(--muted)}
.wkb-s{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{position:relative;border:1px solid var(--line);border-radius:10px;padding:6px 0 7px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--card)}
.wd small{font-size:var(--t4);color:var(--muted)}
.wd b{font-size:var(--t3);line-height:1.2}
.wd .wn{font-size:var(--t4);font-weight:700;min-width:22px;height:20px;line-height:20px;border-radius:99px;color:var(--muted)}
.wd.on .wn{background:var(--hl);color:#141A2E}
.wd.tdy{border:2px solid var(--ink);padding:5px 0 6px}
.wd.fut{opacity:.45}
body[data-theme="dark"] .top .brand>span:first-child:not(.htl)::after{background:#F7DC6F;opacity:.75}
.wd .wt{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.stt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stt-i{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:9px 10px;border-radius:10px;background:var(--soft);text-align:left;min-width:0}
.stt-i b{font-size:var(--t2);line-height:1.25;font-variant-numeric:tabular-nums}
.stt-i b small{font-size:var(--t4);font-weight:500;color:var(--muted);margin-left:1px}
.stt-i span{font-size:var(--t4);color:var(--muted);white-space:nowrap}
.shs{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.shs::-webkit-scrollbar{display:none}
.shc{flex:none;width:76px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;scroll-snap-align:start}
.shc .cover{--w:76px;box-shadow:0 2px 6px rgba(20,26,46,.12)}
.shc-t{font-size:var(--t4);font-weight:700;color:var(--ink);width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.shc small{font-size:var(--t4);color:var(--muted);white-space:nowrap}
.shc.add .shc-p{width:76px;height:108px;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;font-size:var(--t1);color:var(--muted)}
.shl{border-top:1px solid var(--line);padding-top:10px}
.morebtn{display:block;width:100%;padding:13px 0;font-size:var(--t4);font-weight:700;color:var(--accent);border-top:1px solid var(--line)}
.mfold>summary{flex-wrap:wrap}
.mp-chips{display:flex;flex-wrap:wrap;gap:4px;width:100%;padding-left:30px;margin-top:2px;order:3}
.mp-t{font-size:var(--t4);font-weight:500;color:var(--ink2);background:var(--soft);border-radius:99px;padding:1px 8px}
.mfold>summary .fold-i{order:2}
/* 간격: 카드 사이 12px */
.hero2{margin:12px 0 0!important}
.meet{margin:12px 0 0!important}
.blk{margin-top:12px!important}
.think,.ceremony,.recbanner{margin:12px 0 0!important}
.sec{margin:16px 2px 8px!important}
.blk>.sec{margin:0 16px 8px!important}
#main{padding-bottom:96px}
/* ===== 나의 밑줄 여정 (세로로 오르는 메뉴) ===== */
.tabs .in{display:grid!important;grid-template-columns:repeat(5,1fr)}
.jy-hd{background:var(--hdr);color:var(--hdr-fg);border-radius:var(--r);padding:18px;margin:12px 0}
body[data-theme="dark"] .jy-hd{background:#1A2142;border:1px solid #2B3462}
.jy-hd small{font-size:var(--t4);font-weight:700;color:var(--hdr-sub)}
.jy-hd h2{margin:6px 0;font-size:var(--t1);line-height:1.3;color:var(--hdr-fg)}
.jy-hd p{margin:0;font-size:var(--t4);color:rgba(255,255,255,.8);line-height:1.6}
.jy-path{position:relative;display:grid;gap:10px;padding-left:38px}
.jy-path::before{content:"";position:absolute;left:14px;top:18px;bottom:18px;width:4px;border-radius:4px;background:var(--line)}
.jy-path::after{content:"";position:absolute;left:14px;bottom:18px;width:4px;border-radius:4px;height:calc((100% - 36px) * var(--p) / 100);background:linear-gradient(to top,var(--accent),#F7DC6F)}
.jf{position:relative;display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.jf-dot{position:absolute;left:-38px;top:14px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:var(--t4);font-weight:700;background:var(--card);border:2px solid var(--line);color:var(--muted);z-index:1}
.jf.done .jf-dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.jf.now .jf-dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.jf.now{border:2px solid var(--accent);padding:13px}
.jf-b{cursor:pointer;min-width:0}
.jf-h{display:flex;align-items:baseline;gap:6px}
.jf-h small{font-size:var(--t4);color:var(--muted);font-weight:500}
.jf-h b{font-size:var(--t2)}
.jf-h em{font-style:normal;font-size:var(--t4);font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:99px;padding:1px 8px;margin-left:4px;align-self:center}
.jf-s{margin:4px 0 0;font-size:var(--t4);color:var(--muted);line-height:1.55;word-break:keep-all}
.jf-st{margin:6px 0 0;font-size:var(--t4);color:var(--ink2)}
.jf-st b{font-size:var(--t3);color:var(--ink)}
.jf-a{white-space:nowrap}
/* 꼭대기: 나눔 */
.jf-share{background:var(--hdr)!important;border-color:var(--hdr)!important;color:var(--hdr-fg);padding:18px 14px}
body[data-theme="dark"] .jf-share{background:#1A2142!important;border-color:#2B3462!important}
.jf-share .jf-h b{font-size:var(--t1)}
.jf-share .jf-h small,.jf-share .jf-s{color:var(--hdr-sub)}
.jf-share .jf-st{color:rgba(255,255,255,.8)}.jf-share .jf-st b{color:#F7DC6F}
.jf-share .jf-h em{color:#141A2E;background:#F7DC6F}
.jf-share .jf-a{background:#F7DC6F!important;color:#141A2E!important}
.jf-share .jf-dot{width:36px;height:36px;left:-40px;font-size:var(--t3);background:#F7DC6F;border-color:#F7DC6F;color:#141A2E}
.jf-share.next .jf-dot{background:var(--card);border-color:#E9CF63;color:#B8962A}
/* ===== 한 페이지 단계 구성 (아래 탭 없음) ===== */
.tabs{display:none!important}
#main{padding-bottom:40px!important}
body{padding-bottom:0!important}
.op-hd{background:var(--hdr);color:var(--hdr-fg);border-radius:var(--r);padding:18px;margin:12px 0}
body[data-theme="dark"] .op-hd{background:#1A2142;border:1px solid #2B3462}
.op-hd small{font-size:var(--t4);font-weight:700;color:var(--hdr-sub)}
.op-hd h2{margin:6px 0 14px;font-size:var(--t1);line-height:1.3;color:var(--hdr-fg)}
.op-hd p{margin:12px 0 0;font-size:var(--t4);color:rgba(255,255,255,.8)}
.op-steps{display:flex;align-items:center}
.op-steps>b{flex:1;height:2px;background:rgba(255,255,255,.2);margin:0 4px 18px}
.op-steps button{display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(255,255,255,.7);font-size:var(--t4)}
.op-steps i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid rgba(255,255,255,.35)}
.op-steps .s-done i{background:var(--accent);border-color:var(--accent);color:#fff}
body[data-theme="dark"] .op-steps .s-done i{color:#10131F}
.op-steps .s-now i{background:#F7DC6F;border-color:#F7DC6F;color:#141A2E}
.op-steps .s-now span,.op-steps .s-done span{color:#fff;font-weight:700}
.op{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.ops,.ops-b{min-width:0}
.ops{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.ops.s-now:not(.open){border:2px solid var(--accent)}
.ops-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;min-height:68px}
.ops-n{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:var(--t4);font-weight:700;border:2px solid var(--line);color:var(--muted)}
.ops.s-done .ops-n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ops.s-now .ops-n{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ops-t{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}
.ops-t b{font-size:var(--t2)}
.ops-t em{font-style:normal;font-size:var(--t4);font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:99px;padding:1px 8px}
.ops-t small{flex-basis:100%;font-size:var(--t4);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ops-t small b{font-size:var(--t4);color:var(--ink)}
.ops-c{flex:none;color:var(--muted);transition:transform .25s}
.ops.open .ops-c{transform:rotate(180deg)}
.ops.open>.ops-h{border-bottom:1px solid var(--line)}
.ops-b{padding:0 12px 14px;animation:opsIn .28s cubic-bezier(.25,.8,.25,1)}
@keyframes opsIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ops-b{animation:none}}
.ops-b>:first-child{margin-top:12px!important}
/* 나눔: 종착지 */
.ops-gift{background:var(--hdr)!important;border-color:var(--hdr)!important;color:var(--hdr-fg)}
body[data-theme="dark"] .ops-gift{background:#1A2142!important;border-color:#2B3462!important}
.ops-gift>.ops-h .ops-t b{font-size:var(--t1);color:var(--hdr-fg)}
.ops-gift>.ops-h .ops-t small{color:var(--hdr-sub)}
.ops-gift>.ops-h .ops-t small b{color:#F7DC6F}
.ops-gift>.ops-h .ops-n{background:#F7DC6F;border-color:#F7DC6F;color:#141A2E;width:36px;height:36px;font-size:var(--t3)}
.ops-gift>.ops-h .ops-c{color:var(--hdr-sub)}
.ops-gift.open>.ops-h{border-bottom-color:rgba(255,255,255,.12)}
.ops-gift .ops-b{background:var(--paper);border-radius:0 0 calc(var(--r) - 2px) calc(var(--r) - 2px);padding-top:2px;color:var(--ink)}
.op-foot{text-align:center;font-size:var(--t4);color:var(--muted);margin:18px 0 0;letter-spacing:.1em}
/* ===== 깔때기: 많이 모아 → 고르고 → 한 줄 새겨 → 나눔 ===== */
.fh{background:var(--hdr);color:var(--hdr-fg);border-radius:var(--r);padding:18px;margin:12px 0}
body[data-theme="dark"] .fh{background:#1A2142;border:1px solid #2B3462}
.fh-line small{display:block;font-size:var(--t4);font-weight:700;color:var(--hdr-sub)}
.fh-line h2{margin:6px 0 8px;font-size:var(--t1);line-height:1.3;color:var(--hdr-fg)}
.fh-line p{margin:0;font-size:var(--t4);line-height:1.6;color:rgba(255,255,255,.8)}
.fh-line blockquote{margin:10px 0 6px;font-size:var(--t2);line-height:1.6;cursor:pointer;word-break:keep-all}
.fh-line blockquote mark{background:linear-gradient(transparent 60%,rgba(247,220,111,.55) 60%)!important;color:var(--hdr-fg)}
.fh-src{font-size:var(--t4);color:rgba(255,255,255,.7)}
.fh-go{display:block;width:100%;margin-top:14px;background:#F7DC6F!important;color:#141A2E!important;height:48px}
.fnl{display:grid;gap:5px;margin-top:16px;justify-items:center}
.fnl-r{width:var(--w);display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-radius:8px;background:rgba(255,255,255,.1);color:var(--hdr-fg);font-size:var(--t4);transition:background .2s}
.fnl-r:nth-child(1){background:rgba(255,255,255,.08)}.fnl-r:nth-child(2){background:rgba(255,255,255,.13)}.fnl-r:nth-child(3){background:rgba(155,160,255,.32)}
.fnl-r:nth-child(4){background:#F7DC6F;color:#141A2E}
.fnl-r b{font-size:var(--t4);font-weight:700}
.fnl-r:active{transform:scale(.98)}
.ops-i{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ops-i svg{width:22px;height:22px}
.ops-gift .ops-i{background:#F7DC6F;color:#141A2E}
/* ===== UX 2: 고정 활동 띠 · 떠 있는 밑줄 버튼 · 납작한 활동 ===== */
.stbar{position:sticky;top:56px;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 -20px 4px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.stbar button{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;border-radius:10px;color:var(--muted)}
.stbar b{font-size:var(--t4);font-weight:700}
.stbar small{font-size:var(--t4);font-variant-numeric:tabular-nums}
.stbar button.on{background:var(--ink);color:var(--paper)}
.stbar button[data-k="gift"]:not(.on) b{color:var(--accent)}
.op-open{display:block}
.ops.open{background:none!important;border:0!important;border-radius:0}
.ops-role{margin:14px 2px 0;font-size:var(--t4);color:var(--muted)}
.ops.open .ops-b{padding:0;background:none!important}
.ops-gift.open{color:var(--ink)}
.op-next{display:grid;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.op-next button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.op-next button>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.op-next b{font-size:var(--t3)}
.op-next small{font-size:var(--t4);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-next small b{font-size:var(--t4);color:var(--ink)}
.op-next .ops-i{width:34px;height:34px;border-radius:10px}
.op-next .opn-gift{background:var(--hdr);border-color:var(--hdr);color:var(--hdr-fg)}
.op-next .opn-gift small{color:var(--hdr-sub)}.op-next .opn-gift small b{color:#F7DC6F}
.op-next .opn-gift .ops-i{background:#F7DC6F;color:#141A2E}
body[data-theme="dark"] .op-next .opn-gift{background:#1A2142;border-color:#2B3462}
/* 떠 있는 밑줄 버튼 */
.fabq{position:fixed;right:max(16px,calc(50% - 300px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:8;display:flex;align-items:center;gap:6px;height:52px;padding:0 18px 0 16px;border-radius:99px;background:#F7DC6F;color:#141A2E;font-size:var(--t3);font-weight:700;box-shadow:0 8px 22px rgba(20,26,46,.28)}
.fabq[hidden]{display:none}
.fabq:active{transform:scale(.96)}
#main{padding-bottom:96px!important}
/* 보내기: 바로가기 + 꾸미기 */
.sh-pre{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.sh-pre button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 4px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.sh-pre b{font-size:var(--t4)}
.sh-pre small{font-size:var(--t4);color:var(--muted)}
.sh-pre button.on{border:2px solid var(--accent);background:var(--accent-soft);padding:9px 3px}
.sh-pre button.on b{color:var(--accent)}
.sh-more{border:1px solid var(--line);border-radius:12px;padding:0 12px;margin:8px 0;background:var(--card)}
.sh-more>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:12px 0;font-size:var(--t4);font-weight:700}
.sh-more>summary::-webkit-details-marker{display:none}
.sh-more>summary small{font-weight:400;color:var(--muted)}
.sh-more>summary::after{content:"＋";margin-left:auto;color:var(--muted);font-weight:400}
.sh-more[open]>summary::after{content:"－"}
.sh-more[open]{padding-bottom:10px}
.gf-open{display:block;margin:12px auto 0;font-size:var(--t4)}
/* ⑫ 어두운 화면 대비 */
.fh-line p,.fh-src{color:rgba(255,255,255,.88)!important}
.fnl-r:nth-child(1){background:rgba(255,255,255,.12)}.fnl-r:nth-child(2){background:rgba(255,255,255,.17)}
body[data-theme="dark"] .stbar button.on{background:var(--accent);color:var(--on-accent)}
/* ===== 색 정리: 잉크 남색 · 인디고 하나 · 형광펜 노랑 하나, 나머지는 무채색 =====
   빨강은 지우기·오류에만 */
:root{--danger:#C2483F}
body[data-theme="dark"]{--danger:#E58A80}
/* 감정 칩: 색 대신 같은 모양 */
.moodt,.lr-e i{color:var(--ink2)!important;background:var(--soft)!important}
.ecloud span{color:var(--ink)!important}
/* 인스타·외부 버튼 */
.btn.ig{background:var(--ink)!important;background-image:none!important;color:var(--paper)!important}
/* 별·후보: 형광펜 계열 하나 */
.star,.stars,.rate button.on{color:#D9B32F!important}
.starb.on,.qs.starb.on{background:var(--hl-soft)!important;color:var(--ink)!important;border-color:transparent!important}
.qs.heart.on,.heart.on{color:var(--accent)!important}
/* 완료·확인은 초록 대신 인디고 */
.vs-st.done .n{background:var(--accent)!important;color:var(--on-accent)!important}
.qq.done .qbar i,.lvbar i{background:var(--accent)!important}
.qok,.chline{color:var(--accent)!important}
.chbox.ok,.chbox.on{border-color:var(--accent)!important;background:var(--accent-soft)!important}
.mk-steps .ok{color:#F7DC6F!important}
.wdots span.ice i{background:var(--accent-soft)!important}
.tdot{background:var(--accent)!important}
.syncdot.on{background:#F7DC6F!important;box-shadow:none!important}
/* 시상·레벨·결산: 남색 하나로 */
.lvbadge{background:var(--hdr)!important;background-image:none!important;box-shadow:none!important;color:#fff!important}
.crowned,.famer.year{background:var(--hl-soft)!important;background-image:none!important;border-color:transparent!important}
.famer.month{border-left-color:var(--accent)!important}
.rp-hero{background:var(--hdr)!important;background-image:none!important}
.life{background:var(--hdr)!important;background-image:none!important;box-shadow:none!important}
body[data-theme="dark"] .life{background:#1A2142!important;border:1px solid #2B3462}
/* 지우기·오류 */
.gf-err,.gf-row .gf-del,.menu button.danger,.danger{color:var(--danger)!important}
.btn.danger{background:var(--danger)!important;color:#fff!important}
/* 이야기 감정 표시 막대 등 --e 를 쓰는 점 */
.jn-dot,.ef-d i{filter:saturate(.9)}
/* ===== 어두운 화면: 밝은 화면과 같은 톤 (남색 · 인디고 · 형광펜) ===== */
:root{--hl-mark:#F7DC6F}
body[data-theme="dark"]{--hl:#F7DC6F;--hl-soft:#3A3622;--hl-mark:rgba(247,220,111,.4);
  --accent:#7C81F2;--accent-soft:#252A55;--on-accent:#FFFFFF;--muted:#A3ABC2;--ink2:#C9D0E2}
body[data-theme="dark"] mark,body[data-theme="dark"] .qcard blockquote mark,body[data-theme="dark"] .meet blockquote mark,body[data-theme="dark"] .think blockquote mark,body[data-theme="dark"] .gf-page mark,body[data-theme="dark"] .l-q mark{background:linear-gradient(transparent 84%,#F7DC6F 84%,#F7DC6F 94%,transparent 94%)!important;color:inherit!important;padding-bottom:1px}
body[data-theme="dark"] .wd.on .wn,body[data-theme="dark"] .collect,body[data-theme="dark"] .fh-go,body[data-theme="dark"] .fnl-r:nth-child(4){color:#141A2E!important}
body[data-theme="dark"] .gf-page,body[data-theme="dark"] .gsm-c{background:#1C2236!important;color:#E8ECF5!important}
body[data-theme="dark"] .gf-ctx,body[data-theme="dark"] .gsm-c .gf-ctx{color:#7F88A3!important}
body[data-theme="dark"] .gsm-t{color:#7F88A3;border-color:#2B3350}
body[data-theme="dark"] .gsm-f{color:#7F88A3}
body[data-theme="dark"] .star,body[data-theme="dark"] .stars{color:#F7DC6F!important}
body[data-theme="dark"] .starb.on,body[data-theme="dark"] .qs.starb.on{background:var(--hl-soft)!important;color:#F7DC6F!important}
body[data-theme="dark"] .top .brand>span:first-child:not(.htl)::after{background:#F7DC6F;opacity:.85}
body[data-theme="dark"] .moodt{background:var(--soft)!important;color:var(--ink2)!important}
/* ===== 떠 있는 「밑줄 긋기」 버튼: 형광펜으로 줄을 긋는 모양 ===== */
.fabq{background:var(--hdr)!important;color:#fff!important;height:52px;padding:0 20px 0 16px!important;gap:8px!important;box-shadow:0 10px 24px rgba(20,26,46,.32)!important;font-size:var(--t3)}
body[data-theme="dark"] .fabq{background:#2A3160!important;border:1px solid #3A4380;box-shadow:0 10px 24px rgba(0,0,0,.45)!important}
.fq-ic{flex:none}
.fq-t{position:relative;z-index:0;font-weight:700;letter-spacing:-.01em}
.fq-t::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-3px;height:3px;border-radius:2px;background:#F7DC6F;opacity:.9;z-index:-1;transform-origin:left;transform:scaleX(1);transition:transform .35s cubic-bezier(.3,.7,.2,1)}
.fq-t{color:#fff}
.fabq .fq-t::after{background:linear-gradient(90deg,rgba(247,220,111,.95),rgba(247,220,111,.75))}
.fabq .fq-t{mix-blend-mode:normal}
.fabq:hover .fq-t::after,.fabq:focus-visible .fq-t::after{transform:scaleX(1.06)}

.smc-ask textarea{display:block;width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:12px;line-height:1.5;resize:none;min-height:64px}
.smc-ask textarea::placeholder{color:rgba(255,255,255,.5)}
.smc-ask textarea:focus{outline:2px solid #F7DC6F;outline-offset:1px;border-color:transparent}
.smc-go{flex:1;height:48px;background:#F7DC6F!important;color:#141A2E!important}
.smc-skip{font-size:var(--t4);color:rgba(255,255,255,.75);padding:10px 6px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
body[data-theme="dark"] .smc-ask{background:linear-gradient(160deg,#232B57 0%,#171D3C 100%)!important;border:1px solid #333D78!important}
.smc-nudge{border-color:var(--accent)!important;background:var(--accent-soft)!important}
.qs-wide{width:100%;min-height:46px}
.gf-to{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 0 12px;font-size:var(--t4);color:rgba(255,255,255,.85)}
.gf-to b{color:#F7DC6F}
#st-library .hero2{margin-top:14px!important}
.chat-head .iconbtn svg{display:block}
/* ===== UX 4: 긋기 → 질문 → 한 번에 답하기 ===== */
/* 채집 카드: 한 줄로 */
#st-library .hero2{padding:14px 14px 14px!important}
.h2-acts{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
#st-library .hero2 .collect,.hero2 .collect{height:48px!important;margin-top:0!important;font-size:var(--t3)!important}
.h2-manual{display:flex!important;align-items:center;margin:0!important;padding:0 14px;height:48px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff!important;text-decoration:none!important;font-size:var(--t4)!important;font-weight:500;white-space:nowrap}
/* 되묻기 상자 */
.askbox{display:grid;gap:10px}
.ab-q{margin:0;font-size:var(--t2);line-height:1.5;font-weight:700;color:var(--ink);word-break:keep-all}
.ab-o{display:flex;flex-wrap:wrap;gap:6px}
.ab-o button{padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:var(--t4);font-weight:500}
.ab-o button:active{transform:scale(.97)}
.ab-r{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.ab-r textarea{display:block;width:100%;box-sizing:border-box;min-height:46px;max-height:120px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--paper);color:var(--ink);line-height:1.45;resize:none}
.ab-go{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
/* 남색 카드 안 */
.smc-ask .ab-q{font-size:var(--t1);line-height:1.45;color:#fff}
.smc-ask .ab-o button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.smc-ask .ab-r textarea{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.smc-ask .ab-r textarea::placeholder{color:rgba(255,255,255,.5)}
.smc-ask .ab-go{background:#F7DC6F;color:#141A2E}
.smc-ask .smc-skip{display:block;margin:8px auto 0;padding:6px 8px}
.smc-ask::before{content:none!important}
.smc-ask blockquote{margin:2px 0 12px!important;font-size:var(--t3)!important;color:rgba(255,255,255,.88)!important}
/* 한 줄로 접힌 선명이의 말 */
.smr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.smr b{font-size:var(--t4);color:var(--accent);white-space:nowrap}
.smr span{flex:1;min-width:0;font-size:var(--t4);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smf{gap:8px!important}
.st-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#E8B92E;flex:none}
.stbar .st-dot{margin-left:2px;align-self:flex-start;margin-top:4px}
.sm-new{font-style:normal;font-size:var(--t4);font-weight:700;color:#141A2E;background:#F7DC6F;border-radius:99px;padding:0 8px;margin-left:2px}
.smc-h .sm-new+span{margin-left:auto}
/* 채집 직후 · 밑줄 상세의 질문 */
.cd-ask{margin:14px 0 4px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.qask .smc-h{margin-bottom:8px}
/* 서재: 접기 화살표 없음 */
#st-shelf .rblk .fold-t{display:none!important}
.smc-h{flex-wrap:nowrap;white-space:nowrap}
.smc-h b{flex:none}
.smc-a .smc-re{margin-left:auto;color:var(--muted);font-size:var(--t4);padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
#cdTalk[hidden]{display:none!important}
/* ===== 원페이지: 띠 없음 · 상세는 올라오는 창 ===== */
.stbar{display:none!important}
#st-library>.hero2:first-child,#st-library>.collect.solo:first-child{margin-top:14px!important}
#sec-quotes,#sec-shelf{margin-top:4px}
.ov{position:fixed;left:0;right:0;top:var(--hdh,56px);bottom:0;z-index:6;background:var(--paper);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(20,26,46,.22);animation:ovUp .26s cubic-bezier(.25,.8,.25,1)}
.ov[hidden]{display:none}
.ov-in{max-width:640px;margin:0 auto;padding:10px 20px 110px;box-sizing:border-box}
@keyframes ovUp{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ov{animation:none}}
body.ov-open{overflow:hidden}
body.ov-open .top{box-shadow:0 0 0 100vmax var(--hdr)!important}
.has-hb #ov .detail>.back:first-child,.has-hb #ov .pb>.back:first-child,.has-hb #ov .ov-in>.back:first-child{display:none}
/* 나눔: 접힌 구역 */
.nfold{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.nfold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:16px}
.nfold>summary::-webkit-details-marker{display:none}
.nfold>summary b{font-size:var(--t2)}
.nfold>summary span{font-size:var(--t4);color:var(--muted)}
.nfold>summary .fold-i{margin-left:auto;align-self:center;color:var(--muted);transition:transform .2s}
.nfold[open]>summary .fold-i{transform:rotate(180deg)}
.nfold>#st-gift{padding:0 12px 14px}
.nfold>#st-gift>:first-child{margin-top:0!important}
/* ===== 표지 중심 첫 화면 ===== */
.bkh{margin:0 -20px;padding-top:18px}
.bkc{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px calc(50% - 92px) 14px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.bkc::-webkit-scrollbar{display:none}
.bks{flex:none;width:184px;scroll-snap-align:center;scroll-snap-stop:always;transition:transform .25s ease,opacity .25s ease;transform:scale(.86);opacity:.55}
.bks.on{transform:none;opacity:1}
.bks-c{position:relative;display:block;width:184px;padding:0;border-radius:4px 10px 10px 4px}
.bks-c .cover{--w:184px;box-shadow:0 14px 30px rgba(20,26,46,.28),0 2px 6px rgba(20,26,46,.18);border-radius:4px 10px 10px 4px}
.bks-c .cover .cv-t{font-size:var(--t2)!important;-webkit-line-clamp:4}
.bks-c .cover .cv-a{font-size:var(--t4)!important}
/* 표지 위에 그어진 형광펜 한 줄 = 밑줄 긋기 */
.bks-hl{position:absolute;left:-10px;right:-10px;bottom:34px;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;background:#F7DC6F;color:#141A2E;font-size:var(--t3);font-weight:700;border-radius:3px 6px 4px 7px;transform:rotate(-2deg) scaleX(0);transform-origin:left center;box-shadow:0 6px 14px rgba(20,26,46,.22);transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.bks.on .bks-hl{transform:rotate(-2deg) scaleX(1)}
.bks-c:active .bks-hl{transform:rotate(-2deg) scaleX(.97)}
@media (prefers-reduced-motion:reduce){.bks,.bks-hl{transition:none}}
.bks-add{height:276px;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:var(--t4);background:var(--card)}
.bks-add span{font-size:var(--t1);line-height:1}
.bkd{display:flex;justify-content:center;gap:5px;margin-top:2px}
.bkd i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:width .2s,background .2s}
.bkd i.on{width:18px;border-radius:3px;background:var(--ink)}
.bkd i.add{background:none;border:1px solid var(--line)}
.bki{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:12px 24px 4px}
.bki-t{font-size:var(--t2);line-height:1.35;word-break:keep-all}
.bki-a{font-size:var(--t4);color:var(--muted)}
.bki-r{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.bki-r button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:var(--t4);color:var(--ink);font-weight:500}
/* 이 책의 밑줄 */
.bkq{margin-top:18px;display:grid;gap:10px}
.bkq.swap{animation:opsIn .24s cubic-bezier(.25,.8,.25,1)}
.bkq-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px}
.bkq-h b{font-size:var(--t2)}
.bkq-h span{font-size:var(--t4);color:var(--muted)}
.bkq-empty{padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);font-size:var(--t4);color:var(--muted);line-height:1.7;background:var(--card)}
.bq{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bq-q{display:block;width:100%;text-align:left;padding:0;font-size:var(--t2);line-height:1.65;color:var(--ink);word-break:keep-all}
.bq-q mark{background:linear-gradient(transparent 58%,var(--hl-mark,#F7DC6F) 58%);color:inherit}
body[data-theme="dark"] .bq-q mark{background:linear-gradient(transparent 84%,#F7DC6F 84%,#F7DC6F 94%,transparent 94%)}
.bq:has(.stps) .bq-q{padding-right:52px}
.bq-m{margin-top:6px;font-size:var(--t4);color:var(--muted)}
.bq-talk{display:grid;gap:4px;width:100%;text-align:left;margin-top:12px;padding:12px;border-radius:12px;background:var(--soft)}
.bq-th{display:flex;align-items:center;gap:6px;font-size:var(--t4)}
.bq-th b{color:var(--ink)}
.bq-th em{font-style:normal;color:var(--muted)}
.bq-ts{font-size:var(--t4);line-height:1.6;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bq-more{font-size:var(--t4);font-weight:700;color:var(--accent)}
.bq-a{margin-top:12px}
.bq-go{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:var(--t4);font-weight:500;color:var(--ink)}
.bq-ask{margin-top:12px;padding:14px;border-radius:12px;background:var(--accent-soft)}
.bq-ask .ab-q{font-size:var(--t3)}
.bq-moreb{border:1px solid var(--line)!important;border-radius:var(--r);background:var(--card)}
/* 도장 */
.stps{position:absolute;top:10px;right:10px;display:flex;gap:4px;pointer-events:none}
.stp{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1.5px solid currentColor;font-size:var(--t4);font-weight:700;letter-spacing:.02em;transform:rotate(-12deg);position:relative}
.stp::after{content:"";position:absolute;inset:2.5px;border-radius:50%;border:1px dashed currentColor;opacity:.55}
.stp-seal{color:#B08A14}
.stp-give{color:var(--accent);transform:rotate(9deg)}
body[data-theme="dark"] .stp-seal{color:#F7DC6F}
.shm{margin-bottom:12px;max-height:56vh;overflow:auto}
#st-library.bkh>.hero2{display:none}
/* 표지 사진 */
.cover.cvi{background-size:cover!important;background-position:center!important;background-color:var(--c)}
.cover.cvi::after{background:linear-gradient(120deg,rgba(255,255,255,.14),transparent 38%)}
.cv-prev{float:right;width:54px;aspect-ratio:2/3;object-fit:cover;border-radius:2px 5px 5px 2px;margin:0 0 6px 10px;box-shadow:0 3px 8px rgba(20,26,46,.2)}
/* ===== 밑줄 현황 ===== */
.sv{display:grid;gap:14px;padding-top:6px}
.sv-lead{margin:0;font-size:var(--t4);color:var(--muted)}
.sv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sv-t{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;display:grid;gap:2px}
.sv-t b{font-size:var(--t1);line-height:1.15;font-weight:700}
.sv-t b small{font-size:var(--t4);font-weight:500;color:var(--muted);margin-left:2px}
.sv-t span{font-size:var(--t4);color:var(--muted)}
.sv-s{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.sv-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sv-h b{font-size:var(--t3)}
.sv-h span,.sv-h .sec-a{font-size:var(--t4);color:var(--muted)}
.sv-h .sec-a{color:var(--accent);font-weight:700}
.sv-m{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}
.sv-m>div{display:grid;gap:3px;justify-items:center}
.sv-mb{display:flex;align-items:flex-end;width:100%;height:72px;border-radius:6px;background:var(--soft);overflow:hidden}
.sv-mb i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:0}
.sv-m b{font-size:var(--t4);font-weight:700}
.sv-m small{font-size:var(--t4);color:var(--muted)}
.sv-b{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:2px 0;font-size:var(--t4);color:var(--ink)}
.sv-bt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sv-bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.sv-bar i{display:block;height:100%;border-radius:99px;background:#F7DC6F}
.sv-bn{color:var(--muted);white-space:nowrap}
.sv-mood{display:flex;flex-wrap:wrap;gap:6px}
.sv-mood span{padding:5px 10px;border-radius:99px;background:var(--soft);font-size:var(--t4)}
.sv-mood span b{color:var(--accent)}
.sv-s .glist{margin:0}
.sv-s .pempty{text-align:center;color:var(--muted);font-size:var(--t4);padding:6px 0}
.sv-ev{display:grid}
.sv-e{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.sv-e:first-child{border-top:0;padding-top:0}
.sv-k{flex:none;font-style:normal;width:44px;text-align:center;padding:3px 0;border-radius:6px;font-size:var(--t4);font-weight:700;background:var(--soft);color:var(--muted)}
.sv-k.k-line{background:#F7DC6F;color:#141A2E}
.sv-k.k-talk{background:var(--accent-soft);color:var(--accent)}
.sv-k.k-seal{background:none;box-shadow:inset 0 0 0 1.5px #B08A14;color:#B08A14}
.sv-k.k-give,.sv-k.k-got{background:var(--accent);color:#fff}
body[data-theme="dark"] .sv-k.k-seal{box-shadow:inset 0 0 0 1.5px #F7DC6F;color:#F7DC6F}
body[data-theme="dark"] .sv-k.k-give,body[data-theme="dark"] .sv-k.k-got{color:#141A2E}
.sv-et{display:grid;gap:2px;min-width:0}
.sv-et b{font-size:var(--t4);font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-et small{font-size:var(--t4);color:var(--muted)}
.sv .morebtn{border-top:1px solid var(--line);margin-bottom:-6px}
.qs-seal{display:flex;align-items:center;justify-content:center;gap:8px}
.stp-s{width:26px;height:26px;font-size:10px;transform:rotate(-12deg)}
.stp-s::after{inset:2px}
.qs-seal:not(.on) .stp-s{opacity:.6}
/* ===== 이야기: 한 편의 글 ===== */
.nar-a{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px 20px 22px}
.nar-m{font-size:var(--t4);color:var(--muted)}
.nar-t{margin:6px 0 16px!important;font-size:var(--t1)!important;line-height:1.35;word-break:keep-all}
.nar-q{display:block;width:100%;text-align:left;padding:0 0 0 14px;border-left:3px solid #F7DC6F;font-size:var(--t2);line-height:1.7;color:var(--ink);word-break:keep-all}
.nar-q mark{background:none;color:inherit}
.nar-b{margin-top:20px}
.nar-b p{margin:0 0 14px;font-size:var(--t3);line-height:1.9;color:var(--ink);word-break:keep-all;white-space:pre-wrap}
.nar-b p:last-child{margin-bottom:0}
.nar-b.wait{opacity:.5}
.nar-b .nar-e{color:var(--muted)}
.nar-w{margin-top:14px;font-size:var(--t4);color:var(--muted);display:flex;align-items:center;gap:8px}
.nar-e2{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.nar-e2 span{padding:4px 10px;border-radius:99px;background:var(--soft);font-size:var(--t4);color:var(--muted)}
.nar .actions{margin-top:14px}
/* ===== 밑줄 현황: 한 달 ===== */
.sv-mn{display:flex;align-items:center;justify-content:center;gap:18px;padding-top:4px}
.sv-mn b{font-size:var(--t2);min-width:120px;text-align:center}
.sv-mn button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:var(--t2);color:var(--ink);line-height:1}
.sv-mn button:disabled{opacity:.3}
.sv-sum{margin:0;text-align:center;font-size:var(--t2);line-height:1.75;color:var(--ink);word-break:keep-all}
.sv-sum b{background:linear-gradient(transparent 60%,#F7DC6F 60%);font-weight:700;padding:0 1px}
body[data-theme="dark"] .sv-sum b{background:linear-gradient(transparent 86%,#F7DC6F 86%,#F7DC6F 96%,transparent 96%)}
.sv-flow{list-style:none;margin:0;padding:0;display:grid}
.sv-st{position:relative;display:flex;gap:12px;padding-bottom:12px}
.sv-st::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.sv-st:last-child{padding-bottom:0}
.sv-st:last-child::before{display:none}
.sv-n{flex:none;font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-size:var(--t4);font-weight:700;margin-top:12px;position:relative}
.sv-st.zero .sv-n{background:var(--line);color:var(--muted)}
.sv-sb{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.sv-sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sv-sh span{font-size:var(--t3);font-weight:500}
.sv-sh b{font-size:var(--t1);font-weight:700;line-height:1.2}
.sv-sh b small{font-size:var(--t4);font-weight:500;color:var(--muted);margin-left:2px}
.sv-st.zero .sv-sh{color:var(--muted)}
.sv-il{display:grid;margin-top:8px}
.sv-i{display:grid;gap:1px;width:100%;text-align:left;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.sv-i b{font-size:var(--t4);font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-i small{font-size:var(--t4);color:var(--muted)}
.sv-ib{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sv-ib small{flex:none}

#sheet .panel{position:relative}
.sp-xa{position:absolute!important;top:20px;right:16px;margin:0!important;z-index:2}
#sheet .panel>h3{font-size:var(--t1)!important;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin:2px 48px 16px 0!important}
#sheet .panel:has(.sp-xa)>.cap-h,#sheet .panel:has(.sp-xa)>.cd>.cd-h,#sheet .panel:has(.sp-xa)>.sh-book{padding-right:48px}
/* 메뉴 */
.menu{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.menu button{padding:15px 16px!important;border:0!important;font-size:var(--t3)!important;color:var(--ink)}
.menu button+button{border-top:1px solid var(--line)!important}
.menu button:active{background:var(--soft)}
.menu #mX{display:none!important}
.menu button.danger{border-top:8px solid var(--paper)!important;color:var(--danger)!important}
.menu button i.ic{margin-right:6px}
.sh-book{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
/* 밑줄 긋기 방법 · 책 추가 */
.cap-h{margin:2px 0 16px}
.caps{display:grid;gap:8px}
.capb.pri{display:grid!important;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;padding:18px!important;border-radius:var(--r)!important}
.capb.pri>span{grid-row:1/3;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.capb.pri b{font-size:var(--t3)}
.capb.pri small{opacity:.85}
.cap-alt{margin-top:10px}
/* 직접 입력 */
.qf-acts{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:6px}
.qf-acts:has(> :only-child){grid-template-columns:1fr}
.qf-acts .btn{height:50px;border-radius:14px!important;font-weight:700}
.qf-acts .btn.ghost{background:var(--card)!important;border:1px solid var(--line)!important;color:var(--ink)!important}
/* 밑줄 그은 직후 */
.cd-h{display:grid!important;gap:2px;margin:2px 0 12px!important}
.cd-h small{font-size:12px;font-weight:700;color:var(--accent)}
.cd-h span{font-size:var(--t4);color:var(--muted)}
.cd blockquote{font-size:var(--t1)!important;line-height:1.55!important;margin:0 0 16px!important}
.cd .cd-ask{padding:16px;border-radius:14px;background:var(--accent-soft);border:0!important}
.cd-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.cd-foot .link{font-size:var(--t4);color:var(--muted)}
.cd-foot .btn{height:40px;padding:0 16px;border-radius:99px;background:var(--card)!important;border:1px solid var(--line)!important;color:var(--ink)!important}
/* 빈 서재 */
.bk-empty{display:flex;flex-direction:column;align-items:center;margin:-8px -20px 14px;padding:30px 20px 4px;background:linear-gradient(180deg,var(--accent-soft) 0%,var(--paper) 100%)}
.bke-c{width:184px;aspect-ratio:2/3;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:6px 12px 12px 6px;background:color-mix(in srgb,var(--card) 80%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink);margin:6px 0 4px;box-shadow:0 14px 30px rgba(20,26,46,.10)}
.bke-plus{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:26px;line-height:1;margin-bottom:6px;box-shadow:0 8px 18px rgba(74,79,209,.3)}
.bke-c b{font-size:var(--t2)}
.bke-c small{font-size:12px;color:var(--muted)}
.bke-steps{padding:4px 16px}
.bke-s{display:flex;gap:12px;align-items:flex-start;padding:14px 0}
.bke-s+.bke-s{border-top:1px solid var(--line)}
.bke-s i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-style:normal;font-size:11px;font-weight:700;margin-top:1px}
.bke-s span{display:grid;gap:2px}
.bke-s b{font-size:var(--t3)}
.bke-s small{font-size:var(--t4);color:var(--muted)}
/* 기본 표지: 천 장정 결 + 가는 띠 */
.cover:not(.cvi){background:linear-gradient(160deg,color-mix(in srgb,var(--c) 82%,#fff) 0%,var(--c) 42%,color-mix(in srgb,var(--c) 80%,#000) 100%)!important}
.cover:not(.cvi)::after{background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px),linear-gradient(120deg,rgba(255,255,255,.2),transparent 40%)!important}
/* 밑줄 화면 질문 상자 = 홈과 같게 */
.pq-ask.bq-ask{margin-top:18px!important}
/* 대화 머리줄: 남색 */
.chat-head{background:var(--hdr)!important;color:var(--hdr-fg,#fff);border-bottom:0!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.chat-head .who{color:var(--hdr-fg,#fff)}
.chat-head .sub{color:var(--hdr-sub,rgba(255,255,255,.7))!important}
.chat-head .iconbtn{color:var(--hdr-fg,#fff)!important}
.savebar{padding:2px 2px 0}
.savebar #saveBtn{height:36px;padding:0 16px;font-weight:700;box-shadow:0 4px 12px rgba(74,79,209,.25)}
/* ===================== 선물하기 2 ===================== */
.gs2-who{margin-top:14px}
.gs2-lb{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 8px}
.gs2-lb b{font-size:12px;font-weight:700;color:var(--muted)}
.gs2-lb button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700}
.gs2-letter{position:relative}
.gs2-letter textarea{display:block;width:100%;box-sizing:border-box;min-height:132px;border:0;background:none;padding:14px 16px;font:inherit;font-size:var(--t3);line-height:1.8;color:var(--ink);resize:vertical;outline:none}
.gs2-letter textarea:disabled{opacity:.35}
.gs2-busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:var(--t4);color:var(--accent);font-weight:500}
.gs2-busy[hidden]{display:none}
.gs2-more{margin-top:12px}
.gs2-o{margin-top:14px}
.gs2-o>span{display:block;margin-bottom:8px;font-size:12px;font-weight:700;color:var(--muted)}
.gs2-seg{grid-template-columns:1fr 1fr!important;margin-top:0!important}
.gs2-act{display:grid;grid-template-columns:1.5fr 1fr;gap:8px;margin-top:14px}
.gs2-act .btn{height:52px;border-radius:14px!important;font-weight:700;font-size:var(--t3)}
.gs2-act .btn.ghost{background:var(--card)!important;border:1px solid var(--line)!important;color:var(--ink)!important}
/* ===================== 출시 점검 ===================== */
/* 시트 아래 버튼: 같은 크기 */
.panel .acts{display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important;margin-top:14px!important}
.panel .acts:has(> :only-child){grid-template-columns:1fr}
.panel .acts .btn{height:50px;border-radius:14px!important;font-weight:700;font-size:var(--t3);padding:0 12px}
.panel .acts .btn.ghost{background:var(--card)!important;border:1px solid var(--line)!important;color:var(--ink)!important}
/* 읽기 상태 */
.st-row .st-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--d)}
.st-row.on b{font-weight:700}
.st-ck{flex:none;color:var(--accent)}
/* 긴 책 제목: 한 줄로 */
.pq-book{display:block!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.pq-book span{margin-left:6px}
.chat-head .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head>div{min-width:0}
/* 대화 위 밑줄: 세 줄까지 */
.chat-quote span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chat-quote{max-height:none!important}
/* 받은 밑줄 표시 */
.gf-from{display:block;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:var(--t4);color:var(--ink2)}
.gf-from b{color:var(--ink)}
.gf-from span{display:block;margin-top:4px;color:var(--ink)}
/* 누를 수 있는 것은 최소 40px */
.bki-st,.bq-pre{min-height:0}
.sp-x{min-width:34px;min-height:34px}
/* iOS: 16px보다 작은 입력칸은 누를 때 화면이 확대됨 */
input:not([type=file]):not([type=checkbox]):not([type=radio]),textarea,select{font-size:16px!important}
.vs-in input{font-size:18px!important}
body.ov-open #fabq{opacity:0!important;pointer-events:none!important;transform:scale(.8)!important}
/* ===================== 표지 위 밑줄 긋기: 표지 아래에 걸친 알약 ===================== */
.bks-c{overflow:visible!important}
.bks-hl{left:50%!important;right:auto!important;bottom:-20px!important;height:42px!important;padding:0 18px 0 15px;gap:7px!important;border-radius:99px!important;
  background:var(--card)!important;color:var(--ink)!important;font-size:var(--t4)!important;font-weight:700;white-space:nowrap;
  box-shadow:0 10px 24px rgba(20,26,46,.22),0 2px 6px rgba(20,26,46,.12)!important;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  transform:translate(-50%,8px) scale(.92)!important;opacity:0;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .3s ease!important}
.bks.on .bks-hl{transform:translate(-50%,0) scale(1)!important;opacity:1}
.bks-c:active .bks-hl{transform:translate(-50%,0) scale(.96)!important}
.bks-hl svg{color:var(--accent);flex:none}
.bks-hl em{font-style:normal;background:linear-gradient(transparent 62%,rgba(247,220,111,.9) 62%,rgba(247,220,111,.9) 92%,transparent 92%);padding:0 1px}
body[data-theme="dark"] .bks-hl{background:#262C45!important;color:#fff!important;border-color:rgba(255,255,255,.08)}
body[data-theme="dark"] .bks-hl svg{color:#F7DC6F}
body[data-theme="dark"] .bks-hl em{background:linear-gradient(transparent 84%,#F7DC6F 84%,#F7DC6F 96%,transparent 96%)}
.bkd{margin-top:-14px!important}
.bks:not(.add){position:relative}
.bks:not(.on) .bks-hl{pointer-events:none}
.bks-hl:active{transform:translate(-50%,0) scale(.96)!important}
/* ===================== 책 화면 2 ===================== */
.pb2 .pb-hero{padding-bottom:26px!important}
.pb2 .pb-cv .cover{--w:140px}
.pb2 .pb-t{font-size:22px!important;letter-spacing:-.02em}
.pb2 .pb-a span{color:var(--muted);font-weight:400}
.pb2 .pb-acts{gap:8px!important;margin-top:20px!important}
.pb-st{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:99px;background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line);font-size:var(--t4);font-weight:500;color:var(--ink)}
.pb-st i{width:7px;height:7px;border-radius:50%;background:var(--d)}
.pb-st svg{color:var(--muted)}
.pb2 .pb-cta{height:40px!important;padding:0 18px!important;gap:7px!important;background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line);box-shadow:0 6px 16px rgba(20,26,46,.12)}
.pb2 .pb-cta svg{color:var(--accent)}
.pb2 .pb-cta em{font-style:normal;background:linear-gradient(transparent 62%,rgba(247,220,111,.9) 62%,rgba(247,220,111,.9) 92%,transparent 92%)}
body[data-theme="dark"] .pb2 .pb-cta{background:#262C45!important;color:#fff!important}
body[data-theme="dark"] .pb2 .pb-cta svg{color:#F7DC6F}
body[data-theme="dark"] .pb2 .pb-cta em{background:linear-gradient(transparent 84%,#F7DC6F 84%,#F7DC6F 96%,transparent 96%)}
.pb-prog2{display:block;width:100%;text-align:left;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);color:var(--ink)}
.pp-h{display:flex;align-items:baseline;gap:8px}
.pp-h b{font-size:var(--t4);font-weight:700}
.pp-h span{font-size:var(--t4);color:var(--muted)}
.pp-h strong{margin-left:auto;font-size:var(--t1);font-weight:700;line-height:1}
.pp-h strong small{font-size:var(--t4);font-weight:500;color:var(--muted);margin-left:1px}
.pp-bar{display:block;height:6px;margin-top:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.pp-bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
body[data-theme="dark"] .pp-bar i{background:#F7DC6F}
.pb-cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pb-cnt button{display:grid;gap:2px;justify-items:start;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);text-align:left}
.pb-cnt b{font-size:var(--t1);font-weight:700;line-height:1.2}
.pb-cnt span{font-size:12px;color:var(--muted)}
.pb2 .pg-rt mark{background:linear-gradient(transparent 64%,rgba(247,220,111,.75) 64%,rgba(247,220,111,.75) 94%,transparent 94%);color:inherit}
body[data-theme="dark"] .pb2 .pg-rt mark{background:linear-gradient(transparent 86%,#F7DC6F 86%,#F7DC6F 95%,transparent 95%)}
.pg-all{display:block!important;text-align:center!important;font-size:var(--t4)!important;font-weight:700;color:var(--accent)!important;padding:13px!important}
.pb-empty{margin-top:24px;padding:22px 16px;border:1px dashed var(--line);border-radius:var(--r);text-align:center;font-size:var(--t4);color:var(--muted)}
.pb-foot{display:flex;align-items:center;justify-content:center;gap:8px;margin:28px 0 8px}
.pb-foot button{padding:8px 10px;font-size:var(--t4);color:var(--muted)}
.pb-foot .dz{color:var(--danger)}
.pb-foot>i{width:3px;height:3px;border-radius:50%;background:var(--line)}
/* ===================== 이야기 화면 2 ===================== */
.nar2 .nar-a{padding:6px 2px 0!important}
.nar-ey{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.nar-ey span{font-weight:700;color:var(--accent);letter-spacing:.04em}
.nar-ey i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
.nar2 .nar-t{font-size:26px!important;line-height:1.3!important;letter-spacing:-.025em;margin:10px 0 16px!important;word-break:keep-all}
.nar-bk{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;color:var(--ink)}
.nar-bk .cover{--w:34px;box-shadow:0 2px 6px rgba(20,26,46,.15)}
.nar-bk span{display:grid;gap:1px;min-width:0}
.nar-bk b{font-size:var(--t4);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nar-bk small{font-size:12px;color:var(--muted)}
.nar2 .nar-q{position:relative;margin-top:22px;padding:22px 20px 20px 20px!important;border:0!important;border-radius:16px;background:color-mix(in srgb,#F7DC6F 14%,var(--card));font-size:var(--t2)!important;line-height:1.75;text-align:left;color:var(--ink)}
body[data-theme="dark"] .nar2 .nar-q{background:rgba(247,220,111,.06)}
.nar-qm{position:absolute;top:-6px;left:14px;font-size:48px;line-height:1;font-weight:700;color:#E3C14E;font-family:Georgia,serif}
.nar2 .nar-q mark{background:linear-gradient(transparent 64%,rgba(247,220,111,.85) 64%,rgba(247,220,111,.85) 94%,transparent 94%)!important;color:inherit}
body[data-theme="dark"] .nar2 .nar-q mark{background:linear-gradient(transparent 86%,#F7DC6F 86%,#F7DC6F 95%,transparent 95%)!important}
.nar2 .nar-b{margin-top:26px!important}
.nar2 .nar-b p{font-size:16px;line-height:2;letter-spacing:-.005em;margin:0 0 18px;color:var(--ink)}
.nar-orn{display:flex;justify-content:center;gap:8px;margin:26px 0 18px}
.nar-orn i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.nar2 .nar-e2{justify-content:center;border-top:0!important;margin-top:0!important;padding-top:0!important}
.nar2 .nar-e2 span{background:none!important;padding:0 4px!important;color:var(--muted)!important;font-size:var(--t4)!important}
.nar-acts{display:grid;grid-template-columns:1.5fr 1fr;gap:8px;margin-top:26px}
.nar-acts .btn{height:50px;border-radius:14px!important;font-weight:700;font-size:var(--t3);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.nar-acts .nar-cont{margin:0!important}
.nar-acts .btn.ghost{background:var(--card)!important;border:1px solid var(--line)!important;color:var(--ink)!important}
.nar-acts .nar-gift svg{color:var(--accent)}
.nar2 .nar-tools{margin-top:12px}
/* 표지 위치 맞추기 */
.ca-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0;border-radius:var(--r);background:var(--soft)}
#caCv{width:180px;height:270px;border-radius:4px 10px 10px 4px;box-shadow:0 12px 26px rgba(20,26,46,.25);touch-action:none;cursor:grab}
.ca-hint{font-size:12px;color:var(--muted)}
.ca-ctl{margin-top:12px;padding:4px 16px}
.ca-row{display:flex;align-items:center;gap:12px;padding:12px 0}
.ca-row+.ca-row{border-top:1px solid var(--line)}
.ca-row span{flex:none;width:36px;font-size:var(--t4);font-weight:700}
.ca-row input{flex:1;accent-color:var(--accent)}
.ca-row em{flex:none;font-style:normal;font-size:12px;color:var(--muted)}
.ca-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ca-btns .btn{height:42px;border-radius:12px!important;background:var(--card)!important;border:1px solid var(--line)!important;color:var(--ink)!important;font-size:var(--t4);font-weight:500}
/* ===================== 현황 3 ===================== */
.s6 .sv-hero{padding-bottom:22px!important}
.s6-ex{display:flex;justify-content:center;gap:6px;margin-top:12px}
.s6-ex span{padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid var(--line);font-size:12px;color:var(--ink2)}
.s6-flow{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.s6-st+.s6-st{border-top:1px solid var(--line)}
.s6-h{display:flex;align-items:center;gap:12px;width:100%;padding:16px;text-align:left;color:var(--ink)}
.s6-h:disabled{cursor:default}
.s6-n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:var(--ink);color:var(--paper)}
.s6-st.zero .s6-n{background:var(--soft);color:var(--muted)}
.s6-l{flex:1;min-width:0;display:grid;gap:4px}
.s6-l>b{font-size:var(--t3);font-weight:500}
.s6-st.zero .s6-l>b{color:var(--muted)}
.s6-pre{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s6-cvs{display:flex;gap:4px}
.s6-cvs .cover{--w:18px;border-radius:2px 4px 4px 2px;box-shadow:0 1px 2px rgba(20,26,46,.2)}
.s6-cvs .cover .cv-t{display:none}
.s6-v{flex:none;display:grid;justify-items:end;gap:2px}
.s6-v strong{font-size:var(--t1);font-weight:700;line-height:1.1}
.s6-v strong small{font-size:12px;font-weight:500;color:var(--muted);margin-left:1px}
.s6-st.zero .s6-v strong{color:var(--muted)}
.s6-v em{font-style:normal;font-size:11px;font-weight:700}
.s6-v em.up{color:#2F8F5B}.s6-v em.dn{color:var(--muted)}
.s6-cv{flex:none;color:var(--muted);transition:transform .2s}
.s6-st.open .s6-cv{transform:rotate(180deg)}
.s6-list{padding:0 16px 10px 54px;display:grid;animation:bkiIn .25s ease}
.s6-i{display:grid;gap:2px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);color:var(--ink)}
.s6-i b{font-size:var(--t4);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s6-i small{font-size:12px;color:var(--muted)}
.s6-ib{grid-template-columns:auto 1fr auto;align-items:center;column-gap:10px}
.s6-ib .cover{--w:22px}
.s6-ib .cover .cv-t{display:none}
.s6-chart{margin-top:14px!important}
.s6 .sv-m>button{gap:6px!important}
.s6 .sv-m>button>b{font-size:12px!important;color:var(--muted)!important;min-height:16px}
.s6 .sv-m>button.on>b{color:var(--accent)!important;font-weight:700!important}
.s6 .sv-mb{height:90px!important}
.s6 .sv-mb i{width:22px!important;border-radius:7px 7px 3px 3px!important}

.sv2-lines i{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--soft) 0%,color-mix(in srgb,var(--accent) 22%,var(--soft)) 50%,var(--soft) 100%);background-size:200% 100%;animation:svShim 1.4s linear infinite}
