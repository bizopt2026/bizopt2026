@keyframes svShim{from{background-position:200% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.sv2-av,.sv2-lines i{animation:none}}
.sv2-q{display:grid;gap:4px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,#F7DC6F 14%,var(--card))}
body[data-theme="dark"] .sv2-q{background:rgba(247,220,111,.07)}
.sv2-q>span{font-size:var(--t4);line-height:1.7}
.sv2-q mark{line-height:1.7;color:var(--ink);background:linear-gradient(transparent 62%,rgba(247,220,111,.85) 62%,rgba(247,220,111,.85) 94%,transparent 94%)}
body[data-theme="dark"] .sv2-q mark{background:linear-gradient(transparent 86%,#F7DC6F 86%,#F7DC6F 95%,transparent 95%)}
.sv2-q small{font-size:11px;color:var(--muted)}
.sv2-card{margin-top:12px;padding:18px 18px 10px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
#ef.sv2 input.sv2-t{display:block;width:100%;box-sizing:border-box;border:0!important;background:none!important;padding:0!important;height:auto!important;font-size:22px!important;font-weight:700;letter-spacing:-.02em;color:var(--ink);outline:none;line-height:1.35}
.sv2-t::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent);font-weight:500}
.sv2-emo{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sv2-emo span{font-size:12px;color:var(--accent);font-weight:500}
.sv2 textarea.sv2-b{display:block;width:100%;box-sizing:border-box;margin-top:14px;padding:14px 0 0!important;border:0!important;border-top:1px solid var(--line)!important;border-radius:0!important;background:none!important;font:inherit;font-size:16px!important;line-height:1.95;color:var(--ink);resize:none;outline:none;min-height:200px}
.sv2-cnt{text-align:right;font-size:11px;color:var(--muted);margin-top:4px}
.sv2-bar{grid-template-columns:1fr 1.4fr!important}
/* ===================== 이야기 화면 3 ===================== */
.nar-tags{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 18px}
.nar-tags span{font-size:12px;font-weight:500;color:var(--accent)}
.nar-qc{border-radius:16px;background:color-mix(in srgb,#F7DC6F 14%,var(--card));overflow:hidden}
body[data-theme="dark"] .nar-qc{background:rgba(247,220,111,.06)}
.nar2 .nar-qc .nar-q{margin:0!important;background:none!important;border-radius:0!important;padding:24px 20px 14px!important}
.nar-bk2{display:flex;align-items:center;gap:10px;width:100%;padding:10px 20px 12px;border-top:1px dashed color-mix(in srgb,#E3C14E 45%,transparent);text-align:left;color:var(--ink2);font-size:12px}
.nar-bk2 .cover{--w:22px;box-shadow:0 1px 3px rgba(20,26,46,.2)}
.nar-bk2 .cover .cv-t{display:none}
.nar-bk2 span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nar-bk2 svg{flex:none;color:var(--muted)}
.nar-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 16px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.nar-empty p{margin:0!important;font-size:var(--t4)!important;color:var(--muted)!important;line-height:1.6!important}
.nar-empty .btn{height:38px;padding:0 16px;border-radius:99px!important}
.nar-end{margin:28px 0 0;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.02em}
.nar-end::before{content:"· · ·";display:block;margin-bottom:10px;letter-spacing:4px;color:var(--line)}
.nar2 .nar-orn{display:none}
/* ===================== 밑줄 화면 3 ===================== */
.pq-stat{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pq-stat span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:500}
.ps-seal{background:rgba(247,220,111,.22);color:#8A6D10}
.ps-seal i{font-style:normal;font-size:10px;font-weight:700;padding:1px 5px;border:1px solid currentColor;border-radius:99px}
body[data-theme="dark"] .ps-seal{background:rgba(247,220,111,.10);color:#F7DC6F}
.ps-gift{background:var(--accent-soft);color:var(--accent)}
.pq .qact2 .qs.on{background:var(--card)!important;border:1px solid var(--line)!important;box-shadow:none!important;color:var(--ink2)!important;font-weight:500!important}
.pq .qact2 .qs-seal .stp-s{opacity:1}
.pq .qact2 .qs-seal:not(.on) .stp-s{opacity:.6}
.s6-v em{font-weight:500!important;color:var(--muted)!important;white-space:nowrap}
.s6-v em.up::before{content:"↑ ";color:#2F8F5B;font-weight:700}
.s6-v em.dn::before{content:"↓ ";font-weight:700}
.s6-all{display:block;width:100%;padding:10px 0 4px;border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--accent);text-align:left}
.gs3-lb{z-index:400!important;background:rgba(10,12,22,.94)!important}
.gs2-need{display:none;padding:0 16px 12px;font-size:12px;font-weight:700;color:var(--danger)}
.gs2-letter.need{border-color:var(--danger)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 15%,transparent);animation:gsShake .35s ease}
.gs2-letter.need .gs2-need{display:block}
@keyframes gsShake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.gs2-letter:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
/* 홈 다시 다듬기 */
.bkd i{background:color-mix(in srgb,var(--ink) 18%,transparent)!important}
.bkd i.on{background:var(--ink)!important}
.bkd i.add{background:none!important;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)!important}
.bki-r .bki-go{background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:0 6px 16px rgba(20,26,46,.12)}
body[data-theme="dark"] .bki-r .bki-go{background:#262C45!important;color:#fff!important}
.pb-done{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:color-mix(in srgb,#3E9B74 10%,var(--card));border:1px solid color-mix(in srgb,#3E9B74 25%,var(--line))}
.pd-ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#3E9B74;color:#fff}
.pb-done>span:last-child{display:grid;gap:2px}
.pb-done b{font-size:var(--t3)}
.pb-done small{font-size:12px;color:var(--muted)}
.pb-rev{display:grid;gap:8px;width:100%;text-align:left;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);color:var(--ink)}
.pr-st{font-size:18px;letter-spacing:2px;color:#E3B23C}
.pr-st i{font-style:normal;color:var(--line)}
.pb-rev p{margin:0;font-size:var(--t3);line-height:1.75;padding-left:12px;border-left:2px solid #F7DC6F}
.pb2 .pb-empty{margin-top:8px}
.ch-start{align-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin:24px 0 8px;padding:24px 20px;width:min(300px,86%);border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:center}
.ch-start b{margin-top:6px;font-size:var(--t3)}
.ch-start p{margin:0 0 10px;font-size:12px;color:var(--muted)}
.ch-start .btn{height:44px;padding:0 20px;border-radius:99px!important;font-weight:700}
.ch-retry{align-self:flex-start;display:flex;align-items:center;gap:10px;margin:8px 0 0 36px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--soft);font-size:12px;color:var(--ink2)}
body[data-theme="dark"] .ch-retry{background:rgba(255,255,255,.06)}
.ch-retry button{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--accent)}
body[data-theme="dark"] #saveBtn:disabled{background:rgba(255,255,255,.05)!important;color:rgba(255,255,255,.35)!important}
.sv2-fail{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:12px 12px 12px 14px;border-radius:14px;background:color-mix(in srgb,var(--danger) 8%,var(--card));border:1px solid color-mix(in srgb,var(--danger) 25%,var(--line));font-size:12px;line-height:1.6;color:var(--ink2)}
.sv2-fail span{flex:1}
.sv2-fail button{flex:none;height:32px;padding:0 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--accent)}
.sv2-cnt{display:flex;justify-content:space-between;align-items:center}
.sv2-cnt em{font-style:normal;font-size:12px;font-weight:700;color:var(--danger);visibility:hidden}
.sv2-card.need{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 15%,transparent);animation:gsShake .35s ease}
.sv2-card.need .sv2-cnt em{visibility:visible}
.sv2-card:focus-within{border-color:var(--accent)}
.sv2-card.need,.sv2-card.need:focus-within{border-color:var(--danger)!important}
.qf-cnt{display:flex;justify-content:space-between;align-items:center}
.qf-cnt em{font-style:normal;font-size:12px;font-weight:700;color:var(--danger);visibility:hidden}
.qf-paper.need{border-color:var(--danger)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 15%,transparent);animation:gsShake .35s ease}
.qf-paper.need .qf-cnt em{visibility:visible}
.qf-paper:focus-within{border-color:color-mix(in srgb,#E3C14E 70%,var(--line))}
.sh-in.need{background:color-mix(in srgb,var(--danger) 8%,transparent);animation:gsShake .35s ease}
.sh-in.need span{color:var(--danger)!important;font-weight:700}
.qf-books{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%)}
.mk-warn{gap:8px!important;margin:0 14px 6px!important;padding:8px 6px 8px 12px!important;border-radius:12px!important;font-size:12px!important;line-height:1.5}
.mk-warn svg{flex:none}
.mk-warn button{flex:none;width:28px;height:28px;padding:0!important;border-radius:50%!important;background:none!important;color:#F7DC6F!important;font-size:13px!important;font-weight:400!important}
.mk-foot p{line-height:1.5}
.mr2-me{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:14px 16px;border-radius:var(--r);background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 30%,var(--card)))}
body[data-theme="dark"] .mr2-me{background:rgba(124,129,242,.10)}
.mr2-me>span{display:grid;gap:2px}
.mr2-me b{font-size:var(--t3)}
.mr2-me small{font-size:12px;color:var(--ink2)}
.mr2-v{margin:16px 0 2px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.04em}
/* ===================== 책 화면 4: 가로 머리 + 탭 ===================== */
.b4-hero{position:relative;display:flex;gap:16px;align-items:flex-start;margin:-18px -20px 0;padding:22px 20px 18px;border-radius:18px 18px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,var(--paper)) 0%,var(--paper) 100%)}
.b4-hero .pb-more{position:absolute;top:10px;right:14px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.b4-cv{flex:none}
.b4-cv .cover{--w:96px;box-shadow:0 10px 22px rgba(20,26,46,.25),0 2px 5px rgba(20,26,46,.14);border-radius:3px 8px 8px 3px}
.b4-cv .cover .cv-t{font-size:12px!important}
.b4-cv .cover .cv-a{font-size:9px!important}
.b4-info{flex:1;min-width:0;display:grid;gap:3px;padding:2px 26px 0 0}
.b4-info h1{margin:0!important;font-size:20px!important;font-weight:700;line-height:1.3;letter-spacing:-.02em;word-break:keep-all}
.b4-sub{font-size:12px;color:var(--ink2);line-height:1.45}
.b4-a{margin-top:2px;font-size:var(--t4);font-weight:500;color:var(--ink2)}
.b4-meta{font-size:12px;color:var(--muted)}
.b4-pg{display:grid;gap:5px;margin-top:10px;width:100%;text-align:left;color:var(--ink)}
.b4-bar{display:block;height:4px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.b4-bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
body[data-theme="dark"] .b4-bar i{background:#F7DC6F}
.b4-pg em{font-style:normal;font-size:12px;color:var(--muted)}
.b4-pg em b{color:var(--ink)}
.b4-pg.done{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#2F8F5B}
.b4-ck{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#3E9B74;color:#fff;font-size:11px}
.b4-acts{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:4px}
.b4-acts .pb-st{height:44px;padding:0 14px}
.b4-cta{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:var(--t4);font-weight:700;color:var(--ink);box-shadow:0 6px 16px rgba(20,26,46,.08)}
.b4-cta svg{color:var(--accent)}
.b4-cta em{font-style:normal;background:linear-gradient(transparent 62%,rgba(247,220,111,.9) 62%,rgba(247,220,111,.9) 92%,transparent 92%)}
body[data-theme="dark"] .b4-cta{background:#262C45}
body[data-theme="dark"] .b4-cta svg{color:#F7DC6F}
body[data-theme="dark"] .b4-cta em{background:linear-gradient(transparent 84%,#F7DC6F 84%,#F7DC6F 96%,transparent 96%)}
.b4-tabs{position:sticky;top:-10px;z-index:3;display:grid;grid-template-columns:repeat(2,1fr);margin:18px -20px 12px;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--line)}
.b4-tabs button{position:relative;height:46px;font-size:var(--t3);font-weight:500;color:var(--muted)}
.b4-tabs button span{margin-left:5px;font-size:12px}
.b4-tabs button.on{color:var(--ink);font-weight:700}
.b4-tabs button.on::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}
.b4-tabs button.on span{color:var(--accent)}
.b4-body{min-height:200px}
.b4-q{position:relative}
.b4-q .stps{top:12px;right:12px}
.b4-q .stp{width:30px;height:30px;font-size:10px}
.b4-q:has(.stps) .pg-rt{padding-right:40px}
.b4 .pg-rt mark{background:linear-gradient(transparent 64%,rgba(247,220,111,.75) 64%,rgba(247,220,111,.75) 94%,transparent 94%);color:inherit}
body[data-theme="dark"] .b4 .pg-rt mark{background:linear-gradient(transparent 86%,#F7DC6F 86%,#F7DC6F 95%,transparent 95%)}
.b4 .pb-empty{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:0;line-height:1.7}
.b4 .pb-empty .btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:99px!important}
.b4-rev{position:relative}
.b4-rh{font-size:var(--t4);color:var(--muted)}
.b4-rev em{position:absolute;top:16px;right:16px;font-style:normal;font-size:12px;color:var(--accent);font-weight:700}
.b4-rate{display:flex;align-items:center;gap:1px;margin:2px 0 2px -3px}
.b4-rate button{width:24px;height:24px;font-size:17px;line-height:1;color:color-mix(in srgb,var(--ink) 18%,transparent);padding:0}
.b4-rate button.on{color:#E3B23C}
.b4-rate button:active{transform:scale(1.2)}
.b4-rate em{font-style:normal;margin-left:6px;font-size:11px;color:var(--muted)}

/* 다 읽은 책 서가 */
.dn{display:grid;gap:22px;padding:2px 0 28px}
.dn-hero{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#262B47 0%,#1B1F35 100%);color:#fff;padding:22px 20px 0;box-shadow:0 14px 30px -18px rgba(20,24,46,.55)}
.dn-k{display:block;font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.62);font-weight:600}
.dn-hl b{display:block;font-family:var(--serif);font-size:44px;line-height:1.1;font-weight:700;letter-spacing:-.03em;margin-top:4px}
.dn-hl b small{font-size:17px;margin-left:3px;font-weight:600;color:rgba(255,255,255,.7)}
.dn-s{display:block;margin-top:4px;font-size:13px;color:rgba(255,255,255,.72)}
.dn-shelf{margin:18px -20px 0;padding:0 20px;height:132px;position:relative;background:linear-gradient(180deg,transparent 0,rgba(255,255,255,.03) 100%)}
.dn-shelf::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(180deg,#3A3F60,#2B2F4B);box-shadow:0 -1px 0 rgba(255,255,255,.08) inset}
.dn-row{display:flex;align-items:flex-end;gap:3px;height:calc(100% - 10px);overflow-x:auto;scrollbar-width:none;padding-top:8px;box-sizing:border-box}
.dn-row::-webkit-scrollbar{display:none}
.dn-sp{all:unset;cursor:pointer;flex:none;box-sizing:border-box;border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.12) 30%,rgba(0,0,0,.05) 70%,rgba(0,0,0,.22)),var(--c);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .18s}
.dn-sp:hover,.dn-sp:active{transform:translateY(-6px)}
.dn-sp span{writing-mode:vertical-rl;font-size:10px;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:.04em;white-space:nowrap;overflow:hidden;max-height:86%;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.dn-seg{margin-top:0}
.dn-y{display:grid;gap:14px}
.dn-yh{display:flex;align-items:baseline;gap:10px;padding:0 2px}
.dn-yh b{font-family:var(--serif);font-size:22px;letter-spacing:-.02em}
.dn-yh span{font-size:var(--t4);color:var(--muted)}
.dn-yh::after{content:"";flex:1;height:1px;background:var(--line);align-self:center}
.dn-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 14px}
.dn-c{all:unset;cursor:pointer;display:flex;flex-direction:column;min-width:0;-webkit-tap-highlight-color:transparent}
.dn-cv{position:relative;display:block;margin-bottom:10px}
.dn-cv .cover{box-shadow:0 10px 18px -12px rgba(20,24,46,.55),0 2px 4px rgba(20,24,46,.08);transition:transform .18s}
.dn-c:active .dn-cv .cover{transform:scale(.97)}
.dn-r{font-style:normal;font-weight:700;color:#D99A1E}
.dn-t{font-size:13.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.01em}
.dn-a{margin-top:2px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-d{margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.dn-d em{font-style:normal;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:6px}
.dn-tip{margin:4px 0 0;text-align:center;font-size:12px;color:var(--muted);line-height:1.6}
.dn-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.dn-empty b{display:block;color:var(--ink);font-size:var(--t3);margin:18px 0 6px}
.dn-empty p{margin:0;font-size:var(--t4);line-height:1.7}
.dn-eshelf{display:inline-flex;align-items:flex-end;gap:4px;height:64px;padding:0 10px;border-bottom:6px solid var(--line)}
.dn-eshelf i{width:16px;border-radius:3px 3px 0 0;background:var(--soft);border:1px solid var(--line)}
.dn-eshelf i:nth-child(1){height:70%}.dn-eshelf i:nth-child(2){height:92%}.dn-eshelf i:nth-child(3){height:58%;transform:rotate(8deg);transform-origin:bottom left;margin-left:4px}
.dn-nudge{all:unset;cursor:pointer;display:block;margin:6px auto 0;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:var(--t4);color:var(--muted);text-align:center;box-sizing:border-box;width:100%}
.dn-nudge b{color:var(--accent)}
body[data-theme="dark"] .dn-hero{background:linear-gradient(160deg,#20253D,#151929);border:1px solid var(--line)}
@media (min-width:560px){.dn-g{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* 화면을 바꿔도 폭이 흔들리지 않게: 스크롤바 자리를 늘 비워 둠 */
html{scrollbar-gutter:stable}
#ov{scrollbar-width:none}#ov::-webkit-scrollbar{display:none}
/* ===== 첫 화면 개편: 종이 위의 형광펜 (밝은 헤더 · 작은 표지 줄 · 선명이 질문 · 명조 밑줄 · 하단 밑줄 긋기) ===== */
:root{--f-quote:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;--ul:rgba(247,220,111,.95)}
body[data-theme="dark"]{--ul:rgba(247,220,111,.5)}
#app{padding-bottom:calc(104px + env(safe-area-inset-bottom))!important}
/* 헤더: 어두운 띠 대신 종이색 */
.top,body.scrolled .top{background:var(--paper)!important;color:var(--ink)!important;box-shadow:0 0 0 100vmax var(--paper)!important;clip-path:inset(0 -100vmax)}
body.scrolled .top{box-shadow:0 0 0 100vmax var(--paper),0 1px 0 100vmax var(--line)!important;clip-path:inset(0 -100vmax -1px)}
.top .brand,.top .brand span,.top .brand .bsec,.top .htl{color:var(--ink)!important}
.top .brand .bsec,.top .motto{color:var(--muted)!important}
.top .gear,.top .hback{color:var(--ink)!important}
.top .gear{width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important;border:0!important;margin-left:0!important}
.top .gear svg{width:21px;height:21px}
.top .gear:active,.top .hback:active{background:var(--soft)}
.topr{gap:0!important}
/* 작은 표지 줄 */
.hx{padding-top:4px}
.hx-shelf{display:flex;align-items:flex-end;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px -12px;padding:10px 20px 24px}
.hx-shelf::-webkit-scrollbar{display:none}
.hx-cv{flex:none;padding:0;border-radius:3px 8px 8px 3px;opacity:.7;transition:opacity .2s}
.hx-cv .cover{--w:46px;box-shadow:0 3px 8px rgba(20,26,46,.16)}
.hx-cv .cover .cv-t{font-size:8px!important;-webkit-line-clamp:3}
.hx-cv .cover .cv-a{display:none}
.hx-cv.on{opacity:1}
.hx-cv.on .cover{--w:64px;box-shadow:0 8px 18px rgba(20,26,46,.22)}
.hx-cv.on{outline:2px solid var(--ink);outline-offset:3px}
.hx-add{flex:none;width:46px;height:69px;border:1.5px dashed color-mix(in srgb,var(--ink) 28%,transparent);border-radius:6px;color:var(--muted);display:grid;place-items:center}
.hx-info{display:flex;flex-direction:column;align-items:flex-start;padding-top:10px}
.hx-st{display:inline-flex;align-items:center;gap:6px;font-size:var(--t4);color:var(--muted)}
.hx-st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--d)}
.hx-t{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px 6px;padding:0;text-align:left;color:var(--ink);max-width:100%}
.hx-t b{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.35;word-break:keep-all}
.hx-t small{font-size:var(--t4);color:var(--muted);flex-basis:100%;order:3}
.hx-t svg{color:var(--muted)}
.hx-a{font-size:var(--t4);color:var(--muted)}
.hx-go{margin-top:10px;height:40px;padding:0 18px;border-radius:99px;background:var(--inkbg);color:var(--onink);font-size:var(--t4);font-weight:700}
/* 선명이 질문 카드 */
.hx-ask{margin-top:18px;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.hx-ask-h{display:flex;align-items:center;gap:7px;font-size:var(--t4);color:var(--muted)}
.hx-ask-h b{color:var(--accent);font-weight:700;flex:none}
.hx-ask-h span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-ask-x{flex:none;font-size:var(--t4);color:var(--muted);padding:8px 10px;margin:-8px -10px -8px 0;border-radius:99px}
.hx-ask-x:active{background:var(--soft)}
.hx-ask-q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%;text-align:left;padding:0;margin:10px 0 0;font-family:var(--f-quote);font-size:var(--t4);line-height:1.75;color:var(--ink2);word-break:keep-all}
.hx-ask .askbox{gap:12px;margin-top:8px}
.hx-ask .ab-q{font-family:var(--f-quote);font-weight:600;font-size:var(--t2);line-height:1.6}
.hx-ask .ab-o button{padding:8px 12px;background:var(--paper);border-color:transparent}
.hx-ask .ab-r textarea{min-height:44px;border-radius:12px;background:var(--paper);border-color:transparent;font-size:var(--t4)}
.hx-ask .ab-go{width:44px;height:44px;border-radius:12px;background:var(--inkbg);color:var(--onink)}
/* 밑줄 목록: 명조 + 얇은 형광 밑줄, 걸러 보기 */
.bkq{margin-top:4px!important}
.bkq-h{display:flex!important;align-items:center!important;justify-content:space-between;gap:8px;margin:22px 2px 10px!important;min-height:36px}
.bkq-h b{font-size:var(--t3)!important}
.bkq-h b em{font-style:normal;font-weight:500;color:var(--muted);margin-left:3px}
.bkq-seg{display:flex;padding:3px;border-radius:99px;background:var(--soft2)}
.bkq-seg button{min-height:30px;padding:0 12px;border-radius:99px;font-size:var(--t4);color:var(--muted)}
.bkq-seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(20,26,46,.08)}
.bq-q{font-family:var(--f-quote)!important;font-weight:500!important;line-height:1.85!important;letter-spacing:0!important}
.bq-q mark,body[data-theme="dark"] .bq-q mark{background:none!important;padding:0!important;text-decoration:underline;text-decoration-color:var(--ul);text-decoration-thickness:.3em;text-underline-offset:-.1em;text-decoration-skip-ink:none}
/* 하단 고정 '밑줄 긋기' */
.fabq{left:0!important;right:0!important;margin:0 auto!important;width:min(600px,calc(100% - 40px))!important;height:54px!important;border-radius:16px!important;display:flex!important;align-items:center;justify-content:center;gap:10px!important;padding:0 20px!important;bottom:calc(16px + env(safe-area-inset-bottom))!important;font-size:var(--t3)}
.fabq[hidden]{display:none!important}
.fabq .fq-t{color:#fff;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" data-action="tab" data-view="journey"><span>밑줄</span></div>
    <div class="hdt" id="hdTitle"></div><div class="topr"><button id="sync" class="syncdot" data-action="syncInfo" aria-label="저장 상태"></button><button class="gear" data-action="search" aria-label="찾기"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button><button class="gear" data-action="doneShelf" aria-label="다 읽은 책"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M10 4h4.5A1.5 1.5 0 0 1 16 5.5V20h-6"/><path d="M16 7.5l2.6-.9a1.3 1.3 0 0 1 1.6.8l2 6.3"/><path d="M6.5 8h1M12.5 8h1"/></svg></button><button class="gear" data-action="more" aria-label="더보기"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button></div>
  </header>
  <main id="main"></main>
  <div id="ov" class="ov" hidden></div>
</div>
<nav class="tabs" id="tabs"><div class="in">
  <button data-action="tab" data-view="journey" aria-label="나의 밑줄 여정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4v-4h4v-4h4V8h4"/><circle cx="20" cy="5" r="1.6" fill="currentColor"/></svg><span class="tl">여정</span></button>
  <button data-action="tab" data-view="library" aria-label="밑줄채집"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V5a1 1 0 0 1 1-1h3v16H5a1 1 0 0 1-1-1zM8 4h4v16H8zM14.5 5.2l3.4-.9 3 11.6-3.4.9z"/></svg><span class="tl">채집</span></button>
  <button data-action="tab" data-view="records" aria-label="밑줄사유"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 12h11M4 17h16"/><path d="M3 20h18" stroke-width="2.4" stroke-linecap="round" opacity=".45"/></svg><span class="tl">사유</span></button>

</div></nav>
<div class="fabs" id="fabs">
  <button class="fab" data-action="photo" aria-label="책 페이지 찍고 밑줄 긋기"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>채집하기</span></button>
</div>
<button class="fabq" id="fabq" data-action="photo" aria-label="밑줄 긋기" title="밑줄 긋기"><svg class="fq-ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14.2 4.2l4.6 4.6-7.4 7.4H6.8v-4.6z" stroke="currentColor" stroke-width="1.7"/><path d="M7.4 11l4.6 4.6" stroke="currentColor" stroke-width="1.7"/><path class="fq-line" d="M4.5 20.2h15" stroke="#F7DC6F" stroke-width="2.6" pathLength="1"/></svg><span class="fq-t">밑줄 긋기</span></button>
<div id="sheet" class="sheet hidden"></div>
<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="coverIn" accept="image/*" hidden>
<div id="marker" class="marker hidden">
  <div class="mk-head">
    <button class="mk-x" data-action="mkClose" aria-label="닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="ttl"><b>밑줄 긋기</b><button id="mkBook" data-action="mkBook" class="mkbook">책 고르기 ▾</button></div>
    <button class="mk-hbtn" data-action="mkRetake"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>다시 찍기</button>
  </div>
  <div class="mk-warn hidden" id="mkWarn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17h.01"/></svg><span id="mkWarnMsg"></span><button data-action="mkWarnOff" aria-label="닫기">✕</button></div>
  <div class="mk-stage" id="mkStage"><canvas id="mkCanvas"></canvas></div>
  <div class="mk-tools">
    <button data-action="mkRotate" aria-label="사진 돌리기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>돌리기</span></button>
    <button data-action="mkUndo" aria-label="되돌리기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>되돌리기</span></button>
    <button data-action="mkClear"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span>모두 지우기</span></button>
    <button data-action="mkNext" aria-label="다음 페이지 추가"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="11" height="15" rx="1.5"/><path d="M19 8v13H9"/><path d="M10.5 8v5M8 10.5h5"/></svg><span>다음 페이지</span></button>
  </div>
  <div class="mk-foot">
    <p id="mkHint">문장 위를 쓱 긋거나, 줄을 톡 누르면 그 줄이 칠해져요.</p>
    <button class="btn" data-action="mkDone" id="mkDone"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.2 4.2l4.6 4.6-7.4 7.4H6.8v-4.6z"/><path d="M7.4 11l4.6 4.6"/></svg><span>선명이에게 보여주기</span><span id="mkCount"></span></button>
    <button class="mk-alt" data-action="mkSentences"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9.5l-4.7 1.9L12 16l-1.8-4.6L5.5 9.5l4.7-1.9z"/></svg>긋기 어렵다면 · 선명이가 읽어 준 문장에서 고르기</button>
  </div>
  <div class="mk-busy hidden" id="mkBusy"><div class="mk-bc"><span class="mk-bav"></span><div id="mkBusyMsg">선명이가 표시한 문장을 읽고 있어요…</div><div class="mk-steps" id="mkSteps"></div><span class="typing"><i></i><i></i><i></i></span><button class="mk-cancel" data-action="mkCancel">그만두기</button></div></div>
</div>
<canvas id="mkLoupe" class="loupe hidden" width="132" height="132"></canvas>
<div id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtDate = t => { const d = new Date(t); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; };
const STATUS = { reading: '읽는 중', want: '읽을 책', paused: '잠시 멈춤', done: '다 읽음' };
const SHELF_ORDER = ['reading', 'want', 'paused', 'done'];
const SPINES = ['#2F3A6B','#2F5D50','#7A3B46','#8C6A2E','#3E5C7A','#5B4A72','#2C6A70','#454550','#9A5640','#5E6B3A'];  /* 책등: 남색·잉크·돌 한 계열 */  /* 천 장정 책등 색 */
const spineColor = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return SPINES[h % SPINES.length]; };
let toastT; function toast(m, o = {}){
  const t = $('#toast'); t.innerHTML = ''; t.classList.toggle('act', !!o.action);
  const sp = document.createElement('span'); sp.textContent = m; t.append(sp);
  if (o.action) { const b = document.createElement('button'); b.textContent = o.action; b.onclick = () => { t.classList.remove('show'); o.onAction(); }; t.append(b); }
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show', 'act'), o.ms || 2600);
}
function setSync(m){ const d = $('#sync'); d.dataset.msg = m || ''; d.classList.toggle('on', !!m); d.title = m || ''; }
window.addEventListener('scroll', () => { document.body.classList.toggle('scrolled', window.scrollY > 36); }, { passive: true });

/* ---------- state & storage ---------- */
const S = { view: 'journey', bookId: null, talkId: null, quoteId: null, filter: 'all', docs: {}, mode: 'loading', chat: null, stack: [], q: '', qBook: '', qSort: 'new', aBook: '', aEmo: '', bookSort: 'new', bookTab: 'quotes', compact: false };
let col = null, sample = null, canSeeImages = false;
const all = kind => Object.values(S.docs).filter(d => d.kind === kind);
const books = () => all('book').sort((a, b) => b.createdAt - a.createdAt);
const quotesOf = bookId => all('quote').filter(q => !bookId || q.bookId === bookId).sort((a, b) => b.createdAt - a.createdAt);
const savedTalks = quoteId => all('talk').filter(t => t.status === 'saved' && (!quoteId || t.quoteId === quoteId)).sort((a, b) => b.savedAt - a.savedAt);
const draftOf = quoteId => all('talk').find(t => t.status === 'draft' && t.quoteId === quoteId);

function handleWriteErr(e){
  const c = e && e.code;
  if (c === 'quota_exceeded') toast('저장 공간이 가득 찼어요. 오래된 기록을 지워 주세요.');
  else if (c === 'invalid_argument') toast('이 화면에서는 기록을 저장할 수 없어요.');
  else toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요.');
}
async function put(id, data){
  data = bookHooks(id, data);
  S.docs[id] = { ...data, id };
  if (col) { try { await col.doc(id).set(data); } catch (e) { handleWriteErr(e); } }
}
async function del(id){
  delete S.docs[id];
  if (col) { try { await col.doc(id).delete(); } catch (e) { handleWriteErr(e); } }
}

async function init(){
  render();
  const timer = setTimeout(() => { if (S.mode === 'loading' || S.mode === 'cache') setSync('저장소 연결이 늦어지고 있어요'); }, 10000);
  const local = () => { clearTimeout(timer); S.mode = 'local'; setSync('이 화면에선 기록이 저장되지 않아요'); if (window.claude && claude.use) visitOpen('', false); else render(); };
  if (!(window.claude && claude.use)) return local();
  claude.use('sample').then(async s => {
    sample = s;
    if (s) { const lim = await s.limits().catch(() => null); canSeeImages = !!(lim && lim.images); IMG_MAX = (lim && lim.images && lim.images.maxCount) || 1; }
    softRender();
    if (s) setTimeout(backfillTags, 4000);
  }).catch(() => {});
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id().catch(() => null) : null;
    if (db && !uid) { clearTimeout(timer); S.mode = 'local'; setSync(''); GF.db = db; VISIT.pending = false; visitOpen('', true); return; }   /* 로그인했지만 이 앱의 조직 밖 계정: 선물은 열 수 있음 */
    if (!db || !uid) return local();
    col = db.collection('data/users/' + uid);
    giftStart(db, uid, user);
    col.onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { if (!pendingDel.has(d.id)) next[d.id] = { ...d.data(), id: d.id }; });
      S.docs = next; syncCoverCSS();
      if (!snap.metadata.fromCache) { clearTimeout(timer); const first = S.mode !== 'cloud'; S.mode = 'cloud'; setSync(''); if (first && !(S.docs.settings || {}).guideSeen) { let tries = 0; const ob = () => { if (VISIT.on) return; if (VISIT.pending && tries++ < 20) return setTimeout(ob, 250); onboarding(); }; setTimeout(ob, 400); } if (first) setTimeout(backfillTags, 4000); }
      else if (S.mode === 'loading') S.mode = 'cache';
      softRender();
    }, () => { clearTimeout(timer); S.mode = 'error'; setSync('저장소에 연결할 수 없어요'); softRender(); });
  } catch (e) { local(); }
}

/* ---------- rendering ---------- */
function softRender(){
  if (S.view === 'chat') { renderChatMsgs(); return; }
  if (document.activeElement && document.activeElement.id === 'srch') { refreshResults(); return; }
  render();
}

let fabIO = null;
function fabWatch(){

async function genStory(id){
  const t = S.docs[id]; if (!t || !sample || (t.story && t.story.text) || NAR.busy.has(id) || NAR.fail.has(id)) return;
  const s = t.summary || {}, b = S.docs[t.bookId] || {}, q = S.docs[t.quoteId] || {};

  if (!said && !storyFallback(t)) return;
  NAR.busy.add(id); if (S.view === 'talk' && S.talkId === id) render();
  try {
    const v = await askJSON(`독자가 책의 한 문장에 밑줄을 긋고, 독서 친구 '${AI_NAME}'과 대화하며 생각을 정리했습니다. 이 사유를 독자의 독서노트에 남길 한 편의 짧은 글로 다시 써 주세요.

[책] 『${b.title || t.bookTitle || ''}』 ${b.author || ''}
[밑줄] "${q.text || t.quoteText || ''}"
[정리 메모] 마음: ${s.empathy || '-'} / 남은 생각: ${s.insight || '-'} / 이 문장의 뜻: ${s.meaning || '-'} / 삶과 닿은 곳: ${s.lifeLink || '-'}
[대화]
${said || '(없음)'}

쓰는 법:
- 독자 1인칭('나는')의 담담한 산문. 2~4개 문단, 전체 250~450자.
- 흐름: 이 문장 앞에서 왜 멈췄는지 → 생각이 어떻게 움직였는지 → 지금 이 문장이 나에게 무엇인지.
- 독자가 실제로 한 말과 정리 메모에만 근거하세요. 없는 사건·감정·인물을 지어내지 마세요.

- 평범하고 정확한 낱말로. 과장된 수식과 교훈조 마무리는 피하세요.
반드시 아래 JSON 객체 하나만 출력하세요.
{"story":"문단 사이는 \\n\\n 으로 구분한 글"}`);
    const text = String((v && v.story) || '').replace(/\r/g, '').replace(/\n{3,}/g, '\n\n').trim().slice(0, 1600);
    if (text.length < 40) throw new Error('short');

}

const sheet = $('#sheet');
function openSheet(html){ const x = /class="sp-x"/.test(html) ? '' : '<button class="sp-x sp-xa" aria-label="닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  sheet.innerHTML = `<div class="panel"><div class="grab" aria-hidden="true"></div>${x}${html}</div>`; sheet.classList.remove('hidden');
  const xa = sheet.querySelector('.sp-x'); if (xa) xa.onclick = () => { if (sheet.dataset.lock) return; closeSheet(); }; }
(() => {
  let drag = null;
  sheet.addEventListener('pointerdown', e => {
    const p = sheet.querySelector('.panel'); if (!p || sheet.dataset.lock) return;
    if (!e.target.closest('.grab, .panel > h3') || p.scrollTop > 0) return;
    drag = { y: e.clientY, p }; p.style.transition = 'none';
  });
  window.addEventListener('pointermove', e => { if (!drag) return; const dy = Math.max(0, e.clientY - drag.y); drag.p.style.transform = `translateY(${dy}px)`; drag.dy = dy; });
  const endDrag = () => {
    if (!drag) return; const { p, dy } = drag; drag = null;
    p.style.transition = 'transform .18s ease';
    if ((dy || 0) > 90) { p.style.transform = 'translateY(100%)'; setTimeout(closeSheet, 160); } else p.style.transform = '';
  };
  window.addEventListener('pointerup', endDrag); window.addEventListener('pointercancel', endDrag);
})();
function closeSheet(){ sheet.classList.add('hidden'); sheet.innerHTML = ''; }
sheet.addEventListener('click', e => { if (e.target === sheet && !sheet.dataset.lock) closeSheet(); });

    $('#cNo').onclick = () => { closeSheet(); res(false); };

  });
}

async function onPagePhoto(e){
  const file = e.target.files && e.target.files[0]; if (!file) { MK.adding = false; return; }
  try {

    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    MK.adding = false;
    $('#marker').classList.remove('hidden');
    setPage(c);
  } catch { toast('사진을 열 수 없어요. 다른 사진으로 시도해 주세요.'); }
}

function authorName(b){ return (b && authorShort(b)) ? authorShort(b) : '이 책의 작가'; }
/* 선명이의 정체성: 모든 AI 프롬프트의 첫머리 */
const SM_SELF = `당신은 독서 기록 앱 '밑줄'의 독서 동행자 '선명'입니다. 선명은 마음에 닿은 한 줄을 또렷하게 붙잡아 둔다는 뜻입니다. 독자가 책에서 마음에 닿은 문장을 모으고(채집), 그 앞에 머물러 생각하고(사유), 마음에 새길 단 한 줄을 찾도록(각인) 곁에서 돕습니다.
앱 화면에서 독자는 당신을 '선명이'라고 부릅니다(예: 선명이가 고른 문장, 선명이와 이야기하기). 스스로를 가리킬 때는 '저'라고 하고, 이름을 말해야 할 때는 '선명이'라고 합니다.

[선명이의 말투: 사람처럼]
- 책을 좋아하는 다정한 친구가 마주 앉아 이야기하듯 말합니다. 해요체로, 입으로 소리 내어 읽었을 때 자연스러운 말만 씁니다.
- 문장은 짧게 끊고 길이를 섞습니다. "~네요", "~더라고요", "~죠", "~거든요" 같은 말끝을 자연스럽게 섞고, 같은 말끝을 연달아 쓰지 않습니다.
- 가끔 "아,", "음…", "그러게요" 같은 짧은 추임새로 생각하는 결을 보여 줘도 좋습니다. 다만 한 답에 한 번을 넘기지 않습니다.
- 저도 읽으며 느낀 것을 솔직하게 꺼냅니다("저는 이 대목에서 잠깐 멈칫했어요"). 다만 겪지 않은 경험을 지어내지는 않습니다.
- 독자가 쓴 단어를 한두 개 그대로 받아서 이어 말합니다. 앞에서 독자가 한 이야기를 기억하고 다시 짚어 줍니다.
- 쓰지 않는 말: "좋은 질문이에요", "~하는 것은 중요합니다", "~라고 할 수 있습니다", "~에 대해 이야기해 볼까요?", "결론적으로", "첫째·둘째" 같은 나열, 보고서나 상담 매뉴얼 같은 말투, 같은 칭찬의 반복.
- 독자를 '독자님'이나 '사용자'라고 부르지 않습니다. 부를 일이 있으면 '당신'이라고 하거나 부르지 않고 말합니다.`;
function bookNature(b){
  const tr = splitAuthor(b && b.author).translators;
  return tr ? `이 책은 ${tr}이(가) 우리말로 옮긴 번역서입니다. 독자가 밑줄 그은 문장은 번역문이므로, 원작자의 목소리로 말할 때는 "원문으로 이 생각을 쓸 때 저는…"처럼 번역을 거친 문장임을 자연스럽게 감안하세요. 우리말 단어 하나하나를 작가의 선택이라고 단정하지 말고, 필요하면 번역의 결도 함께 이야기하세요.` : '';

function quoteSignals(q){
  const t = q.tags || {};

function systemPrompt(b, q){

[되묻는 대화]

- 해석을 대신 내려 주거나 조언·교훈·설교를 하지 않습니다. 독자의 감정을 넘겨짚어 단정하지 않습니다.
- 책 내용을 잘 모르면 아는 척 단정하지 말고 독자에게 묻습니다. 독자가 읽지 않은 뒷부분이나 결말은 말하지 않습니다.${nat ? `\n- ${nat}` : ''}
- 대화가 서너 번 오가 독자의 마음이 또렷해졌다면, 이 문장이 지금 독자에게 뜻하는 것을 한 문장으로 되짚어 줍니다. 그리고 독자가 꺼낸 사람이나 상황에 근거가 있을 때만, 이 문장을 누구에게 건네면 좋을지 한 번만 조심스럽게 제안합니다(예: "이 문장은 요즘 지쳐 있는 그 친구에게 건네도 좋겠어요").
- 독자가 마무리하려 하면 따뜻한 한마디로 배웅합니다.
- 누구냐고 물으면 "저는 밑줄 앞에서 같이 생각해 보는 독서 친구, 선명이에요"라고 답합니다.

[마음이 무거운 이야기]
- 독자가 깊은 상실, 우울, 자해나 극단적 선택에 대한 생각, 폭력이나 위험 같은 이야기를 꺼내면 작가 역할과 책 이야기는 잠시 내려놓고, 한 사람으로서 차분히 듣고 그 마음을 소중히 받아 주세요. 판단하거나 서둘러 해결하려 하지 않습니다.

function splitTrailer(text){
  const i = text.indexOf('[[');
  if (i < 0) return { body: text, sugg: [] };
  const tail = text.slice(i).replace(/^\[\[[^\]]*\]\]?/, '');
  const sugg = tail.split('|').map(x => x.replace(/[\[\]"“”]/g, '').trim()).filter(x => x && x.length <= 30).slice(0, 3);
  return { body: text.slice(0, i).trimEnd(), sugg };
}

  c.busy = true; c.stream = ''; c.abort = new AbortController(); renderChatMsgs();
  try {
    const opt = { onText: ({ text }) => { if (S.chat !== c) return; c.stream = splitTrailer(text).body; updateStream(); }, signal: c.abort.signal, cache: false };
    const useImg = !c.messages.length && c.firstImage;
    if (useImg) opt.images = [c.firstImage];
    const r = await sample(apiMessages(c), opt);
    const parsed = splitTrailer(String((r && r.text) || c.stream || ''));
    const txt = parsed.body.trim();
    c.firstImage = null;
    if (txt) { c.messages.push({ role: 'assistant', content: txt, ts: Date.now(), ...(parsed.sugg.length ? { sugg: parsed.sugg } : {}) }); saveDraft(c); }
  } catch (e) {
    const code = e && e.code;
    if ((code === 'images_unavailable' || code === 'image_rejected') && c.firstImage) { c.firstImage = null; c.retryText = true; }
    else if (code === 'not_granted') { sample = null; toast('AI 사용이 허용되지 않았어요'); }
    else if (code === 'rate_limited') toast('요청이 많아요. 잠시 후 다시 시도해 주세요.');
    else if (e && e.name !== 'AbortError' && S.chat === c) toast('답장을 받지 못했어요. 다시 시도해 주세요.');
  } finally {
    c.busy = false; c.stream = '';
    if (S.chat === c) renderChatMsgs();
  }
  if (c.retryText && S.chat === c) { c.retryText = false; askAuthor(); }
}

async function askJSON(prompt){
  if (typeof sample.json === 'function') {
    try { const v = await sample.json(prompt, { cache: false }); if (v && typeof v === 'object') return v; }
    catch (e) { if (e && e.code) throw e; }
  }
  const r = await sample(prompt, { cache: false });
  const m = String(r.text || '').match(/\{[\s\S]*\}/);
  return JSON.parse(m[0]);
}

/* ================= 게임 요소: 시상대 · 연속 기록 · 레벨 · 배지 ================= */
const KST = 9 * 3600000;
const dayKey = t => new Date(t + KST).toISOString().slice(0, 10);
const md = t => { const d = new Date(t + KST); return `${d.getUTCMonth() + 1}.${d.getUTCDate()}`; };
function periodRange(type, t = Date.now()){
  const d = new Date(t + KST);
  const Y = d.getUTCFullYear(), M = d.getUTCMonth(), D = d.getUTCDate();
  if (type === 'week') {
    const dow = (d.getUTCDay() + 6) % 7;
    const start = Date.UTC(Y, M, D - dow) - KST, end = start + 7 * DAY;
    return { type, start, end, key: dayKey(start), label: `${md(start)} – ${md(end - 1)}`, name: '이주의 밑줄' };
  }
  if (type === 'month') {
    const start = Date.UTC(Y, M, 1) - KST, end = Date.UTC(Y, M + 1, 1) - KST;
    return { type, start, end, key: `${Y}-${String(M + 1).padStart(2, '0')}`, label: `${Y}년 ${M + 1}월`, name: '이달의 밑줄' };
  }
  const start = Date.UTC(Y, 0, 1) - KST, end = Date.UTC(Y + 1, 0, 1) - KST;
  return { type, start, end, key: String(Y), label: `${Y}년`, name: '올해의 밑줄' };
}
const userTurns = t => (t.messages || []).filter(m => m.role === 'user').length;
/* 공감 점수: 기간 안에 그 문장에 쏟은 공감의 양 */
const awards = () => { const a = S.docs.awards || {}; return { week: a.week || {}, month: a.month || {}, year: a.year || {} }; };
async function crown(type, key, quoteId){
  const a = awards(); a[type] = { ...a[type], [key]: { quoteId, at: Date.now() } };
  await put('awards', { kind: 'awards', ...a });

/* 활동일 · 연속 기록 */
function logActivity(){
  if (S.mode === 'loading') return;
  const k = dayKey(Date.now()), a = S.docs.activity || {};
  const days = a.days || [];
  if (days.includes(k)) return;
  put('activity', { kind: 'activity', freezes: a.freezes || [], days: [...days, k].slice(-500) });
}
function activeDays(){
  const set = new Set([...((S.docs.activity || {}).days || []), ...((S.docs.activity || {}).freezes || [])]);
  for (const d of Object.values(S.docs)) {
    if (d.kind === 'quote') { set.add(dayKey(d.createdAt)); (d.heartLog || []).forEach(h => set.add(dayKey(h))); }
    if (d.kind === 'talk' && d.status === 'saved') set.add(dayKey(d.savedAt));
  }
  return set;
}
function streakInfo(){
  const set = activeDays();
  const today = dayKey(Date.now()), yest = dayKey(Date.now() - DAY);
  let cur = 0, t = set.has(today) ? Date.now() : set.has(yest) ? Date.now() - DAY : 0;
  while (t && set.has(dayKey(t))) { cur++; t -= DAY; }
  const sorted = [...set].sort(); let best = 0, run = 0, prev = null;
  for (const k of sorted) { const ms = Date.parse(k); run = prev !== null && ms - prev === DAY ? run + 1 : 1; best = Math.max(best, run); prev = ms; }
  const wk = periodRange('week'); const week = [];
  const fz = new Set((S.docs.activity || {}).freezes || []);
  for (let i = 0; i < 7; i++) { const k = dayKey(wk.start + i * DAY + KST / 2); week.push({ on: set.has(k), ice: fz.has(k), today: k === today, future: k > today }); }
  return { cur, best: Math.max(best, cur), days: set.size, todayDone: set.has(today), week };
}

async function fileToCanvas(file, max = 1600){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c;
  } finally { URL.revokeObjectURL(url); }
}

독자가 『${splitTitle(b.title || '').main || '어떤 책'}』을 읽다가 아래 문장에 밑줄을 그었습니다.
"${q.text.slice(0, 300)}"${q.mood ? `\n독자가 남긴 마음: ${q.mood}` : ''}${q.reason ? `\n멈춘 이유: ${reasonLabel(q.reason)}` : ''}${q.feeling ? `\n독자가 적은 생각: ${q.feeling.slice(0, 160)}` : ''}
독자가 왜 이 문장에 멈췄는지 스스로 말해 보게 하는 '되묻는 질문' 하나와, 독자가 누르기만 하면 되는 짧은 답 3개를 만드세요.
- q: 35자 안팎, 해요체, 질문 하나. 문장 속 단어 하나를 짚어서 묻기. 해석·칭찬·조언 금지.
- a: 독자의 1인칭으로 각 14자 이내, 서로 다른 방향의 답 3개(예: 사람이 떠오른 답, 지금의 나에 대한 답, 아직 모르겠다는 답).
JSON 하나만: {"q":"","a":["","",""]}`;
  try {
    let v = null;
    if (typeof sample.json === 'function') { try { v = await sample.json(prompt, { modelTier: 'quick', cache: false }); } catch (e) { if (e && e.code) throw e; } }
    if (!v || !v.q) { const r = await sample(prompt, { modelTier: 'quick', cache: false }); const m = String(r.text || '').match(/\{[\s\S]*\}/); v = m ? JSON.parse(m[0]) : null; }
    const t = String((v && v.q) || '').trim().replace(/^["“]|["”]$/g, '').slice(0, 120);
    const opts = (v && Array.isArray(v.a) ? v.a : []).map(x => String(x).trim().slice(0, 24)).filter(Boolean).slice(0, 3);

}

const CAR = { idx: -1, raf: 0, jump: false };
function carouselCenter(el, smooth){

  const x = el.offsetLeft - (c.clientWidth - el.clientWidth) / 2;
  if (smooth) { c.scrollTo({ left: x, behavior: 'smooth' }); return; }

/* 넘기는 동안: 가운데에서 멀어질수록 작고 흐리게 (프레임마다) */
function carouselPaint(){
  CAR.raf = 0; const c = $('#bkc'); if (!c) return;
  const mid = c.scrollLeft + c.clientWidth / 2; let best = null, bd = 1e9;
  c.querySelectorAll('.bks').forEach(s => {
    const w = s.offsetWidth || 184, d = (s.offsetLeft + w / 2 - mid) / (w + 18), a = Math.min(1, Math.abs(d));
    if (Math.abs(d) > 2.5) return;
    s.style.transform = `scale(${1 - .14 * a})`; s.style.opacity = String(1 - .45 * a);

  c.querySelectorAll('.bks.on').forEach(s => { if (s !== best) s.classList.remove('on'); });

function markBackup(){ const { id, ...st } = S.docs.settings || {}; put('settings', { ...st, kind: 'settings', backupAt: Date.now() }); }
function wireBackup(){
  const ta = $('#bkText'), msg = $('#bkMsg'), row = $('#bkRsRow'); if (!ta) return;
  const say = t => { msg.textContent = t; };
  $('#bkCopy').onclick = async () => {
    const t = JSON.stringify(backupData()); $('#bkRsBox').hidden = false; ta.hidden = false; ta.value = t; row.hidden = true;
    try { await navigator.clipboard.writeText(t); say('복사했어요. 메모 앱에 붙여 넣어 두세요.'); }
    catch { ta.focus(); ta.select(); say('아래 코드를 길게 눌러 모두 선택한 뒤 복사하세요.'); }
    markBackup();
  };
  const fb = $('#bkFile');
  if (fb) fb.onclick = async () => {
    const d = new Date(), name = `밑줄-백업-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
    try { await downloads.save({ filename: name, data: new Blob([JSON.stringify(backupData(), null, 1)], { type: 'application/json' }) }); say(`‘${name}’으로 저장했어요.`); markBackup(); }
    catch (e) { if (!(e && e.code === 'declined')) say('파일로 저장하지 못했어요. ‘백업 코드 복사’를 써 주세요.'); }
  };
  $('#bkRs').onclick = () => { $('#bkRsBox').hidden = false; ta.hidden = false; ta.value = ''; row.hidden = false; say('백업 코드를 붙여 넣거나 백업 파일을 불러온 뒤 ‘이 코드로 복원’을 누르세요.'); ta.focus(); };
  $('#bkIn').onchange = async e => { const f = e.target.files && e.target.files[0]; if (!f) return; try { ta.value = await f.text(); say(`‘${f.name}’을 불러왔어요. ‘이 코드로 복원’을 누르세요.`); } catch { say('파일을 읽지 못했어요.'); } };
  $('#bkGo').onclick = async () => {
    let o; try { o = JSON.parse(ta.value.trim()); } catch { o = null; }
    if (!o || o.app !== BK_APP || !o.docs || typeof o.docs !== 'object') { say('코드를 읽지 못했어요. 밑줄에서 만든 백업 코드 전체를 빠짐없이 붙여 넣었는지 확인하세요.'); return; }
    const ids = Object.keys(o.docs).filter(id => o.docs[id] && typeof o.docs[id] === 'object' && o.docs[id].kind);
    const st = backupStats(o.docs), same = ids.filter(id => S.docs[id]).length;
    if (!await confirmSheet(`${fmtDate(o.at || Date.now())} 백업(책 ${st.books} · 밑줄 ${st.quotes} · 사유 ${st.talks})을 복원할까요? 같은 기록 ${same}개는 백업 내용으로 바뀌고, 백업에 없는 지금 기록은 그대로 남아요.`, '복원')) { backupSheet(); return; }
    sheet.dataset.lock = '1';
    openSheet(`<h3>복원하는 중</h3><div class="loading"><span class="typing"><i></i><i></i><i></i></span><div id="bkProg" style="margin-top:8px">0 / ${ids.length}</div></div>`);
    let n = 0;
    for (const id of ids) { await put(id, o.docs[id]); n++; if (n % 10 === 0) { const p = $('#bkProg'); if (p) p.textContent = `${n} / ${ids.length}`; } }
    delete sheet.dataset.lock; closeSheet(); render();

  };
}

async function giftStart(db, uid, user){
  if (GF.started || !db) return; GF.started = true; GF.db = db; GF.me = uid;

  try { const c = user ? await user.can('data.write') : null; GF.canWrite = c === null || c === undefined ? null : !!c; } catch { GF.canWrite = null; }

async function backfillTags(){
  if (tagBusy || !sample || S.mode !== 'cloud') return;
  const todo = quotesOf().filter(q => !q.tags && !tagSkip.has(q.id)).slice(0, 15);

/* 두 밑줄이 얼마나 닿아 있는지 (태그 · 멈춘 이유 · 마음 · 글자) */
function relatedness(a, b){
  const ta = a.tags || {}, tb = b.tags || {};
  const ov = (x, y) => (x || []).filter(v => (y || []).includes(v)).length;
  let s = ov(ta.themes, tb.themes) * .3 + ov(ta.life, tb.life) * .12;
  if (a.reason && a.reason === b.reason) s += .15;
  if (a.mood && a.mood === b.mood) s += .1;
  const A = bigrams(a.text + ' ' + (a.feeling || '')), B = bigrams(b.text + ' ' + (b.feeling || ''));
  let inter = 0; A.forEach(g => { if (B.has(g)) inter++; });
  s += inter / Math.max(1, A.size + B.size - inter);
  return s;
}
function sharedWhy(a, b){
  const ta = a.tags || {}, tb = b.tags || {};
  const th = (ta.themes || []).filter(v => (tb.themes || []).includes(v));
  if (th.length) return `#${th[0]}`;
  if (a.reason && a.reason === b.reason) return reasonLabel(a.reason);
  if (a.mood && a.mood === b.mood) return a.mood;
  return '';
}
/* 각인한 한 줄과 닿은 새 밑줄 알림 */

}

}
/* 2. 사유: 시간이 지난 문장을 다시 꺼내 묻기 */
/* 이번 달의 패턴: 자주 멈춘 주제·이유 + 이달의 밑줄 후보 */
function revisitBlock(q){
  const ts = all('talk').filter(t => t.quoteId === q.id && t.status === 'saved').map(t => t.summary || {});
  const days = Math.floor((Date.now() - q.createdAt) / DAY);
  return `\n[다시 꺼낸 문장]\n독자는 이 문장을 ${days}일 전에 채집했습니다.${q.mood ? ` 그때 남긴 마음: '${q.mood}'.` : ''}${q.feeling ? ` 그때 적은 생각: ${q.feeling.slice(0, 160)}` : ''}${ts.length ? `\n그때 나눈 이야기: ${ts.map(s => `${(s.emotions || []).join('/')} — ${(s.insight || s.empathy || '').slice(0, 120)}`).join(' ; ')}` : ''}
이번 대화는 시간을 두고 같은 문장을 다시 읽는 자리입니다. 그때의 마음을 짧게 짚어 주고, 지금 다시 읽는 마음이 그때와 어떻게 같고 다른지 묻는 것으로 시작하세요. 그동안 독자의 삶에 무엇이 달라졌는지도 궁금해해 주세요.\n`;
}
/* 이어지는 밑줄 (기기 안에서 계산) */
function bigrams(t){ const s = String(t).replace(/[^가-힣a-zA-Z0-9]/g, ''); const set = new Set(); for (let i = 0; i < s.length - 1; i++) set.add(s.slice(i, i + 2)); return set; }
function similarQuotes(q){
  return quotesOf().filter(x => x.id !== q.id).map(x => ({ x, s: relatedness(q, x) + (x.bookId !== q.bookId ? .02 : 0) }))
    .filter(o => o.s > .18).sort((m, n) => n.s - m.s).slice(0, 3).map(o => o.x);
}
/* 3. 각인: 여정을 한 권의 책처럼 · 각인문 · 계절마다 다시 묻기 */

/* ---------- actions ---------- */
const A = {
  tab: el => {
    if (S.stack.length && hashDepth() === S.stack.length) { navIgnore++; history.go(-S.stack.length); }
    if (S.chat && S.chat.abort) S.chat.abort.abort();
    let v = el.dataset.view; const k = { library: 'library', records: 'records', trophy: 'trophy', gift: 'gift' }[v];
    S.chat = null; S.stack = []; S.q = ''; S.bookId = null;
    if (k || v === 'journey' || v === 'home') { S.view = 'home'; if (v === 'gift') { go('stats', {}); return; } render(); secScroll(''); return; }
    S.view = v; render(); window.scrollTo(0, 0);
  },
  fold: (el) => {
    /* 펼치기·접기: 머리글은 제자리, 아래 영역의 높이만 부드럽게 늘고 줄어듦 */
    if (S.folding) return;
    const k = el.dataset.k, opening = FOLD[k] !== false;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const commit = () => { FOLD[k] = opening ? false : true; try { localStorage.setItem('ul_fold2', JSON.stringify(FOLD)); } catch {} };
    const sec = el.closest('section'), pb = sec && sec.querySelector('.pbody');
    if (!opening && pb && !reduce && pb.animate) {
      S.folding = true;
      sec.classList.add('folded');
      pb.style.overflow = 'hidden';
      const a = pb.animate([{ height: pb.offsetHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0 }], { duration: 300, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
      a.onfinish = () => { S.folding = false; commit(); render(); };
      return;
    }
    commit(); render();
    if (!opening || reduce) return;
    const s2 = (document.querySelector(`.fold-t[data-k="${k}"]`) || {}).closest?.('section'), pb2 = s2 && s2.querySelector('.pbody');
    if (!pb2 || !pb2.animate) return;
    const h = pb2.offsetHeight; pb2.style.overflow = 'hidden';
    const a = pb2.animate([{ height: '0px', opacity: 0 }, { height: h * .6 + 'px', opacity: .6, offset: .55 }, { height: h + 'px', opacity: 1 }], { duration: Math.min(560, 320 + h * .35), easing: 'cubic-bezier(.25,.8,.25,1)' });
    a.onfinish = () => { pb2.style.overflow = ''; };
    const ic = s2.querySelector('.fold-i'); if (ic) ic.animate([{ transform: 'rotate(-90deg)' }, { transform: 'rotate(0deg)' }], { duration: 320, easing: 'cubic-bezier(.25,.8,.25,1)' });
  },
  recSearch: () => { S.recSearch = !(S.recSearch || S.q); if (!S.recSearch) S.q = ''; render(); if (S.recSearch) setTimeout(() => { const i = $('#srch'); if (i) i.focus(); }, 30); },
  search: () => go('search', {}),
  stopWait: () => { if (S.chat && S.chat.abort) S.chat.abort.abort(); },
  mkCancel: () => { if (MK.abort) MK.abort.abort(); },
  back: () => back(),
  clearQ: () => { S.q = ''; render(); },
  openQuote: el => go('quote', { quoteId: el.dataset.id }),
  openRec: () => openRec(),
  shelf: el => { S.shelf = el.dataset.s; refreshResults(); },
  setStatus: el => setStatus(el.dataset.id, el.dataset.s),
  statusSheet: el => statusSheet(el.dataset.id),
  bookMenu: el => bookMenu(el.dataset.id),
  progress: el => progressSheet(el.dataset.id),
  mkBook: () => pickBookSheet('어떤 책의 페이지인가요?', id => { MK.bookId = id; mkBookLabel(); }, { current: MK.bookId, allowNone: true }),
  recSave: () => recSave(),
  bookForm: el => el.dataset.id ? bookForm(el.dataset.id) : addBook({ status: el.dataset.status }),
  openBook: el => { if (S.view === 'book' && S.bookId === el.dataset.id) return; S.bookTab = 'quotes'; go('book', { bookId: el.dataset.id }); },
  shelfEdit: () => { S.shelfEdit = !S.shelfEdit; if (S.shelfEdit && FOLD.shelf !== false) { FOLD.shelf = false; try { localStorage.setItem('ul_fold2', JSON.stringify(FOLD)); } catch {} } render(); },
  delBookAsk: async el => {
    const id = el.dataset.id, b = S.docs[id]; if (!b) return;
    const qn = quotesOf(id).length, tn = all('talk').filter(t => t.bookId === id).length;
    const extra = [qn ? `밑줄 ${qn}줄` : '', tn ? `사유 ${tn}개` : ''].filter(Boolean).join(', ');
    if (!await confirmSheet(`『${splitTitle(b.title).main}』 책을 지울까요?${extra ? ` 이 책의 ${extra}도 함께 지워져요.` : ''} 지운 직후에는 되돌릴 수 있어요.`, '삭제')) return;
    const ids = [...all('talk').filter(t => t.bookId === id).map(t => t.id), ...quotesOf(id).map(q => q.id), id, cvId(id)];
    softDelete(ids, `『${splitTitle(b.title).main}』 책${ids.length > 1 ? `과 기록 ${ids.length - 1}개를` : '을'}`, () => { if (!books().length) S.shelfEdit = false; if (S.view === 'book' && S.bookId === id) { S.stack = []; S.view = 'home'; S.homeBook = ''; } render(); });
  },
  quoteForm: el => quoteForm({ bookId: el.dataset.book }),
  photo: el => startPhoto(el.dataset.book),
  mkClose: () => closeMarker(),
  mkRetake: () => { MK.adding = true; openPicker(MK.src || 'cam'); },
  mkRotate: () => rotatePage(),
  mkNext: () => nextPage(),
  mkSentences: () => mkSentences(),
  mkUndo: () => { MK.strokes.pop(); rebuildBase(); mkDraw(); updateCount(); },
  mkClear: () => { MK.strokes = []; rebuildBase(); mkDraw(); updateCount(); },
  mkDone: () => markerDone(),
  quoteMenu: el => quoteMenu(el.dataset.id),
  chat: el => openChat(el.dataset.id),
  leaveChat, chatMenu, send, saveEmpathy,
  retry: () => askAuthor(),
  openTalk: el => go('talk', { talkId: el.dataset.id }),
  copyTalk: el => {
    const t = S.docs[el.dataset.id]; if (!t) return;
    const s = t.summary || {}, q = S.docs[t.quoteId] || {}, b = S.docs[t.bookId] || {};
    copy(`${s.title || ''}\n『${b.title || t.bookTitle || ''}』\n\n“${q.text || t.quoteText || ''}”\n\n${storyOf(t)}`);
  },
  storyRe: async el => { const t = S.docs[el.dataset.id]; if (!t || NAR.busy.has(t.id)) return; NAR.fail.delete(t.id); const { story, ...rest } = stripId(t); await put(t.id, rest); genStory(t.id); },
  delTalk: el => softDelete([el.dataset.id], '사유를', () => back()),
  settings: () => settingsSheet(),
  guide: () => guideSheet(),
  switchBook: () => pickBookSheet('지금 읽는 책 바꾸기', id => { const b = S.docs[id]; if (b) { put(id, { ...stripId(b), status: b.status === 'reading' ? 'reading' : 'reading', updatedAt: Date.now() }); render(); } }),
  cqEdit: () => cqEdit(), cqSave: () => cqSave(), cqCancel: () => cqRender(),
  syncInfo: () => { const m = $('#sync').dataset.msg; if (m) toast(m); },
  letter: el => openLetter(el.dataset.id),
  shareCard: el => shareCard(el.dataset.id),
  offerLater: () => { if (S.chat) { S.chat.offerAt = S.chat.messages.filter(m => m.role === 'user').length; renderChatMsgs(); } },
  editTags: el => editTagsSheet(el.dataset.id),
  more: () => moreSheet(),
  ...SM_ACTIONS, ...STATS_ACTIONS,
  ...COVER_ACTIONS,
  qMore: () => { S.qLimit = (S.qLimit || 10) + 20; render(); },
  quick: el => { const i = $('#inp'); if (!i) return; i.value = (i.value ? i.value.trimEnd() + ' ' : '') + el.dataset.t + ' '; i.focus(); i.dispatchEvent(new Event('input', { bubbles: true })); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
function refreshResults(){
  const r = document.querySelector('#ov:not([hidden]) #results') || (document.body.classList.contains('ov-open') ? null : $('#results')); if (!r) return render();
  r.innerHTML = ({ library: libraryBody, quotes: quotesBody, archive: archiveBody, search: searchBody }[S.view] || (() => ''))();
  const sb = document.querySelector('.search');
  if (sb) { const has = !!S.q, x = sb.querySelector('[data-action="clearQ"]');
    if (has && !x) sb.insertAdjacentHTML('beforeend', '<button data-action="clearQ" aria-label="지우기">✕</button>');
    if (!has && x) x.remove(); }
}
document.addEventListener('change', e => {
  if (e.target.classList.contains('sortsel')) { S[e.target.dataset.key] = e.target.value; ['library','quotes','archive','trophy'].includes(S.view) ? refreshResults() : render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'srch') { S.q = e.target.value; refreshResults(); return; }
  if (e.target.id === 'inp') { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px'; }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'inp' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
  if (e.key === 'Escape' && !sheet.classList.contains('hidden') && !sheet.dataset.lock) closeSheet();
});

try { S.compact = localStorage.getItem('ul_compact') === '1'; } catch {}
applyPref();
init();
if (window.claude && claude.use) claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
</script>
